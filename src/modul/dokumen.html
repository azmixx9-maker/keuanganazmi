<style>

*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;font:14px 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}

#view{padding:18px;overflow:auto;flex:1}

button{font:inherit;border:0;border-radius:7px;padding:7px 12px;cursor:pointer;background:var(--ac);color:#fff}button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.rd{background:var(--rd)}button.ok{background:var(--ok)}button.s{padding:3px 8px;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar>input,.bar>select{width:auto;flex:0 1 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px}.stat{cursor:pointer;border-left:4px solid var(--gd)}.stat b{font-size:26px;display:block}.stat span{color:var(--mu);font-size:12px}
.al{border-left:4px solid var(--rd);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}

.modal{position:fixed;inset:0;background:#0009;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px;z-index:20}.mb{background:var(--cd);border-radius:12px;padding:18px;width:100%;max-width:1000px}
.two{display:grid;grid-template-columns:minmax(260px,1fr) 1.3fr;gap:16px}#ff,#pvw{max-height:72vh;overflow:auto}
label{display:block;font-size:12px;color:var(--mu);margin:9px 0 3px}.ch{display:flex;align-items:flex-end;gap:6px;height:100px}.ch i{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--nv);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:80}
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;margin:0 auto;padding:13mm 22mm 18mm;font:12pt/1.35 Cambria,Georgia,'Times New Roman',serif;position:relative;border:1px solid #ccc;text-align:justify}

// Nomor otomatis mengikuti judul: kode dibentuk dari judul (bisa diubah manual),
// urutan dihitung per kode per tahun dari surat yang masih tercatat.
const BB_STOP=new Set(['DAN','ATAU','YANG','UNTUK','DI','KE','DARI','TENTANG','DENGAN','PADA','OLEH','DALAM']);
const BB_CHIPS=['Nama','NIP','Jabatan','Alamat','Departemen','Unit / Outlet','No. KTP','No. HP','Keperluan'];
const BB_TITLES=['Surat Pernyataan','Surat Pengantar','Surat Rekomendasi','Surat Pemberitahuan','Surat Izin','Surat Undangan','Surat Keputusan','Surat Kuasa'];
const cleanCode=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
const reservedCodes=()=>new Set(Object.entries(T).filter(([k,t])=>k!=='bebas'&&typeof t.code==='function').map(([k,t])=>String(t.code(1,'I',2000)).split('/')[1]));
function autoCode(title){
  const w=String(title||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().split(/[^A-Z0-9]+/).filter(x=>x&&!BB_STOP.has(x));
  if(!w.length)return 'SRT';
  const rest=w[0]==='SURAT'?w.slice(1):w,res=reservedCodes();
  // Kandidat berurutan; dipilih yang belum dipakai jenis surat bawaan agar nomor tidak tercampur.
  const c=[w.map(x=>x[0]).join(''),rest.map(x=>x.slice(0,3)).join(''),w.map(x=>x.slice(0,2)).join(''),w.map(x=>x.slice(0,3)).join('')].map(cleanCode).filter(x=>x.length>=2);
  return c.find(x=>!res.has(x))||c[c.length-1]||'SRT';
}
const bbLines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const bbRows=d=>{let r=[];try{r=JSON.parse(d.poin_json||'[]')}catch(e){}return(Array.isArray(r)?r:[]).filter(x=>Array.isArray(x)&&(String(x[0]||'').trim()||String(x[1]||'').trim())).map(x=>[String(x[0]||'').trim(),String(x[1]||'').trim()])};
T.bebas={n:'Surat Bebas (judul & isi bebas)',kop:1,
  opt:['kode','mode','kepada','salam','pembuka','poin_json','isi','penutup','ttdmode','ttd_caption','ttd2_nama','ttd2_jabatan','ttd2_caption'],
  f:[['tgl','Tanggal surat','date'],['judul','Judul surat'],['pj','Pejabat penandatangan','sel',()=>MD.pj.map(p=>p.nama)],['kode','Kode nomor'],['mode','Format isi'],['kepada','Kepada Yth.'],['salam','Salam pembuka'],['pembuka','Paragraf pembuka'],['poin_json','Poin'],['isi','Isi surat'],['penutup','Kalimat penutup'],['ttdmode','Penandatangan'],['ttd_caption','Keterangan tanda tangan'],['ttd2_nama','Nama pihak kedua'],['ttd2_jabatan','Jabatan pihak kedua'],['ttd2_caption','Keterangan pihak kedua']],
  req:d=>[['tgl'],['judul'],['pj'],[d.mode==='poin'?'poin_ok':'isi']],
  validate:d=>{
    if(d.mode==='poin'){
      const raw=(()=>{try{return JSON.parse(d.poin_json||'[]')}catch(e){return[]}})();
      if(!bbRows(d).length)return{m:'Tambahkan minimal satu poin (mis. Nama, Jabatan).',sel:'#bb-poin'};
      if(raw.some(r=>!String(r[0]||'').trim()&&String(r[1]||'').trim()))return{m:'Ada poin yang belum diberi label.',sel:'#bb-poin'};
    }else if(!String(d.isi||'').trim())return{m:'Isi surat wajib diisi.',sel:'#field-isi'};
    if(d.ttdmode==='2'&&!String(d.ttd2_nama||'').trim())return{m:'Nama pihak kedua wajib diisi.',sel:'#field-ttd2_nama'};
    return null;
  },
  code:(s,m,y,c)=>`${String(s).padStart(3,'0')}/${c||'SRT'}/HR-OHM/${m}/${y}`,
  html:d=>{
    const paras=s=>bbLines(s).map(x=>`<p>${esc(x)}</p>`).join(''),rows=bbRows(d),to=bbLines(d.kepada);
    const cap=d.ttd_caption||'Hormat kami,';
    const sign=d.ttdmode==='2'?`<div class="sg two">${ttd(P(d).nama,P(d).jabatan,P(d),cap,signerDate(d))}${ttd(d.ttd2_nama,d.ttd2_jabatan,null,d.ttd2_caption||'Pihak kedua,','')}</div>`:oneSign(d,cap);
    return (to.length?`<p>Kepada Yth.<br>${to.map(esc).join('<br>')}</p>`:'')
      +(d.salam==='0'?'':'<p>Dengan hormat,</p>')
      +paras(d.pembuka)
      +(d.mode==='poin'&&rows.length?lst(rows):'')
      +paras(d.isi)
      +(d.penutup==='0'?'':'<p>Demikian surat ini dibuat untuk digunakan sebagaimana mestinya.</p>')
      +sign;
  }};

// Roster karyawan yang diberikan HR per 12 November 2026.
// Kunci pencocokan adalah No Karyawan (nip), bukan nama atau nomor kartu,
// karena ada beberapa nama/No Kartu ID yang muncul pada lebih dari satu unit.
const EMPLOYEE_ROSTER_VERSION=1;
const EMPLOYEE_ROSTER_SEED=[];
function mergeEmployeeRoster(){
 if(Number(MD.employeeRosterVersion||0)>=EMPLOYEE_ROSTER_VERSION)return {added:0,updated:0,skipped:EMPLOYEE_ROSTER_SEED.length};
 let added=0,updated=0;
 DB.emp=Array.isArray(DB.emp)?DB.emp:[];
 for(const row of EMPLOYEE_ROSTER_SEED){
  const current=DB.emp.find(e=>String(e.nip||'').trim()===row.nip);
  if(current){
   // Data roster menjadi sumber terbaru untuk identitas; status kontrak/akhir kontrak
   // yang mungkin sudah diinput HR dipertahankan.
   for(const key of ['nama','nik','alamat','jab','outlet','masuk'])current[key]=row[key];
   if(current.dept===undefined)current.dept='';
   if(!current.status)current.status='Belum Ditetapkan';
   updated++;
  }else{
   DB.emp.push({id:uid(),...row});
   added++;
  }
 }
 MD.employeeRosterVersion=EMPLOYEE_ROSTER_VERSION;
 MD.employeeRosterDate='2026-11-12';
 MD.employeeRosterSummary={total:EMPLOYEE_ROSTER_SEED.length,added,updated};
 if(typeof log==='function')log('Roster karyawan dimuat',String(EMPLOYEE_ROSTER_SEED.length),`${added} data baru, ${updated} data diperbarui`);
 return {added,updated,skipped:0};
}

// Format tampilan mail-merge: nama/alamat menjadi Title Case, singkatan jabatan tetap kapital.
const JOB_ACRONYMS=new Set(['CSO','HK','PIC','SPV','ME','FO','F&B','FB','TH','TH1','TH2','TH3','SPA','HR','HRD','GM','HM','EDC','LPK','OHM','OPA','PT','SE','SH','AMD','FBS','REC','ART','KPI','IT','QC','QA','GA','OPR','CO','COO','CEO']);
const ADDRESS_ACRONYMS=new Set(['RT','RW','RT/RW','RW/RT']);
function smartTitleCase(value,acronyms=new Set()){
 const source=String(value??'').trim().replace(/\s+/g,' ');
 if(!source)return '';
 return source.replace(/[\p{L}]+(?:\.[\p{L}]+)*\.?/gu,word=>{
  const key=word.replace(/\./g,'').toLocaleUpperCase('id-ID');
  if(acronyms.has(key)||acronyms.has(word.toLocaleUpperCase('id-ID')))return word.toLocaleUpperCase('id-ID');
  const lower=word.toLocaleLowerCase('id-ID');
  return lower.charAt(0).toLocaleUpperCase('id-ID')+lower.slice(1);
 });
}
const formatPersonName=value=>smartTitleCase(value,new Set(['SE','SH','S.KOM','SIKOM','AMD','A.MD']));
const formatAddress=value=>smartTitleCase(value,ADDRESS_ACRONYMS).replace(/\b(Kel|Kec|Kab|Jl|Lr|Ds|Kp|No)\.(?=\S)/g,'$1. ').replace(/\b((?:Kel|Kec|Kab|Jl|Lr|Ds|Kp|No)\.\s+)([\p{L}])/gu,(_,prefix,first)=>prefix+first.toLocaleUpperCase('id-ID'));
const formatJobTitle=value=>smartTitleCase(value,JOB_ACRONYMS);
const formatGeneralTitle=value=>smartTitleCase(value,new Set([...JOB_ACRONYMS,'RT','RW']));
function formatDocumentData(data){
 const d={...data};
 for(const key of ['nama','nama_penerima','pimpinan','nama_karyawan'])if(d[key])d[key]=formatPersonName(d[key]);
 for(const key of ['alamat'])if(d[key])d[key]=formatAddress(d[key]);
 for(const key of ['jabatan','jab_lama','jabatan_lama','posisi','jabatan_baru'])if(d[key])d[key]=formatJobTitle(d[key]);
 for(const key of ['unit','outlet','lokasi','tujuan','asal','dept','departemen'])if(d[key])d[key]=formatGeneralTitle(d[key]);
 if(Array.isArray(d.employees))d.employees=d.employees.map(e=>({...e,nama:formatPersonName(e.nama),jab:formatJobTitle(e.jab||e.jabatan),alamat:formatAddress(e.alamat)}));
 return d;
}



/* ===== OPA v35: Penamaan dokumen baku =====
   Pola : {Jenis Dokumen} [- {Outlet}] {TAHUN}-{NO URUT 3 digit} - {Nama Karyawan/Kandidat}.pdf
   Contoh: Surat Peringatan 2026-012 - Budi Santoso.pdf | Kontrak PKWT 2026-001 - Ani Lestari.pdf
