<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WIB='Asia/Jakarta',BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const todayISO=()=>new Intl.DateTimeFormat('en-CA',{timeZone:WIB}).format(new Date());
const dt=(i,o)=>i?new Date(i+'T12:00:00+07:00').toLocaleDateString('id-ID',{timeZone:WIB,...o}):'–';
const dS=i=>dt(i,{day:'numeric',month:'short'}),dL=i=>dt(i,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const gid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dg=s=>String(s||'').replace(/\D/g,'');
const waNum=s=>{const d=dg(s);return d[0]==='0'?'62'+d.slice(1):d[0]==='8'?'62'+d:d};
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const K={emp:'ohm-v16-karyawan',nc:'ohm-v16-kasus',late:'opa-hr-suite-v1-late-cases'};
const rd=k=>{try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:[]}catch{return[]}};
const S={emp:rd(K.emp),nc:rd(K.nc),late:rd(K.late)};if(!S.late.length)S.late=rd('ohm-telat-v1-kasus');
let saved=null;const save=()=>{try{for(const k in K)localStorage.setItem(K[k],JSON.stringify(S[k]));saved=new Date()}catch{toast('Data tidak bisa disimpan di browser ini')}$('#sv').textContent=saved?'Tersimpan '+saved.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:WIB}):''};
let tt;const toast=(m,u)=>{const t=$('#ts');t.innerHTML=ic('ok')+esc(m)+(u?'<button class="ub" data-a="undo">Urungkan</button>':'');t.classList.toggle('u',!!u);t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),u?6000:2400)};

const NC_ST=['Belum','Disampaikan','Menunggu Bukti','Selesai'],LT_ST=['Belum','Disampaikan','Menunggu Konfirmasi','Selesai'];
const NC_OUT=['Menunggu','Disetujui','Ditolak'],LT_OUT=['Menunggu','Diterima','Ditindaklanjuti','Perlu Pembinaan'];
const tone=s=>({Disampaikan:'b','Menunggu Bukti':'a','Menunggu Konfirmasi':'a',Selesai:'g',Disetujui:'g',Diterima:'g',Ditindaklanjuti:'b','Perlu Pembinaan':'r',Ditolak:'r'}[s]||'');
const pill=s=>`<span class="pill ${tone(s)}">${esc(s)}</span>`;
const isP=k=>k.jenisKasus==='Pulang tidak terbaca sistem';
const detail=k=>isP(k)?(k.jenisPulang==='Pulang terlambat'?'Pulang terlambat, finger OUT tidak terbaca':`Pulang lebih awal${k.waktuPulang?' pukul '+k.waktuPulang:''}, finger OUT tidak terbaca`):k.statusAbsen==='Keduanya'?'Tidak finger IN dan OUT':k.statusAbsen==='Pulang'?'Tidak finger OUT (pulang)':'Tidak finger IN (masuk)';
const short=k=>isP(k)?(k.jenisPulang||'Pulang'):k.statusAbsen==='Keduanya'?'IN & OUT':k.statusAbsen==='Pulang'?'Finger OUT':'Finger IN';
const per=iso=>{let y=+iso.slice(0,4),b=+iso.slice(5,7);if(+iso.slice(8,10)>=26){b++;if(b>12){b=1;y++}}return{b,y}};
const nowM=()=>per(todayISO());
const perRange=(b,y)=>{let pb=b-1,py=y;if(pb<1){pb=12;py--}const p=n=>String(n).padStart(2,'0');return{from:`${py}-${p(pb)}-26`,to:`${y}-${p(b)}-25`}};
const perTxt=(b,y)=>{const r=perRange(b,y);return`${dS(r.from)} – ${dS(r.to)} ${y}`};
const recalc=r=>{r.totalMenit=(r.dasarMenit||0)+r.hari.reduce((a,h)=>a+h.menit,0);r.frekuensi=(r.dasarKali||0)+r.hari.length};
const lper=()=>{const i=$('#ldate'),o=$('#lper');if(i&&o&&i.value){const p=per(i.value);o.textContent='Masuk periode kerja '+perTxt(p.b,p.y)}};
const dayForm=()=>{const p=PRE;PRE='';return`<h2>Catat keterlambatan</h2>${empPick(p)}<div><label>Tanggal</label><input class="in" type="date" name="tanggal" id="ldate" value="${LDP||todayISO()}" required><div class="tb" style="margin:8px 0 0"><button type="button" class="btn s" data-a="dset" data-d="0">Hari ini</button><button type="button" class="btn s" data-a="dset" data-d="1">Kemarin</button></div><p class="mu" id="lper" style="margin-top:6px"></p></div><div class="r2"><div><label>Menit terlambat</label><input class="in" type="number" min="1" name="menit" required></div><div><label>Catatan</label><input class="in" name="catatan"></div></div>`};
const dayList=k=>{const hr=(k.hari||[]).slice().sort((a,b)=>a.tanggal.localeCompare(b.tanggal)),base=k.hari?(k.dasarMenit||0):mins(k);if(!hr.length&&!base)return'<p class="mu">Belum ada rincian tanggal.</p>';return(base?`<div class="hi"><span class="mu">Tercatat sebelumnya, tanpa tanggal</span><b>${fmtM(base)}</b></div>`:'')+hr.map(h=>`<div class="hi"><span>${dt(h.tanggal,{weekday:'short',day:'numeric',month:'short'})}${h.catatan?`<span class="mu"> · ${esc(h.catatan)}</span>`:''}</span><span style="display:flex;align-items:center;gap:4px"><b>${h.menit} menit</b><button class="ib" data-a="delday" data-id="${k.id}" data-d="${h.tanggal}" aria-label="Hapus tanggal">${ic('x')}</button></span></div>`).join('')};
const ltDet=k=>{const hr=(k.hari||[]).slice().sort((a,b)=>a.tanggal.localeCompare(b.tanggal)),f=k.frekuensi||hr.length,p=[];if(f)p.push(`${f} kali, rata-rata ${Math.round(mins(k)/f)} menit`);if(hr.length)p.push('Tgl '+hr.map(h=>+h.tanggal.slice(8)).join(', '));if(k.catatan)p.push(k.catatan);return esc(p.join(' · '))};
const hrTxt=k=>(k.hari&&k.hari.length)?'\n• Rincian: '+[...k.hari].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).map(h=>dS(h.tanggal)+' ('+h.menit+' menit)').join(', '):'';
const mins=k=>parseInt(k.totalMenit)||0;
const cap=s=>String(s||'').toLowerCase().replace(/(^|[\s.'-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const avc=n=>{const i=1+((n||'?').charCodeAt(0)%4);return` style="background:var(--s${i});color:var(--m${i})"`};
const fmtM=m=>m>=60?`${Math.floor(m/60)} j ${m%60} m`:`${m} menit`;

const MEMO='Memo Nomor 008/OHM/X/2026 tentang Aturan Syarat dan Ketentuan Absensi Staff OPA - Group';
const ncMsg=k=>`Halo Sdr. ${cap(k.nama)},\n\nKami dari HR Corporate OPA Hospitality Management. Berdasarkan data fingerprint, terdapat ketidaksesuaian absensi Anda:\n• Hari/Tanggal: ${dL(k.tanggal)}\n• Outlet: ${k.outlet||'-'}\n• Shift: ${k.shift||'-'}\n• Keterangan: ${detail(k)}\n\n${isP(k)?'Jika ada alasan yang jelas dan dapat dipertanggungjawabkan, mohon sampaikan kepada PIC Outlet.':'Jika Anda memiliki bukti kehadiran dengan timestamp yang jelas, mohon sampaikan kepada PIC Outlet.'}\n\nPengajuan Manual Clock dibuat oleh PIC Outlet dan hanya dapat diproses setelah disetujui Direksi (${MEMO}). Jika tidak disetujui atau tidak ada bukti yang valid, shift tersebut tidak dihitung dalam penggajian / dilakukan pemotongan untuk karyawan kontrak.\n\nMohon pastikan finger IN dan OUT terbaca sistem.\nTerima kasih.\n\nHormat kami,\nHR Admin Corp. OHM`;
const ltMsg=k=>`Halo Sdr. ${cap(k.nama)},\n\nKami dari HR Corporate OPA Hospitality Management. Berdasarkan rekap kehadiran periode ${perTxt(k.bulan,k.tahun)}, tercatat keterlambatan Anda:\n• Outlet: ${k.outlet||'-'}\n• Jabatan: ${k.jabatan||'-'}${hrTxt(k)}\n• Total keterlambatan: ${mins(k)} menit${k.frekuensi?` (${k.frekuensi} kali)`:''}\n\nKeterlambatan berpengaruh pada penilaian kedisiplinan, pemotongan prorate pendapatan bulanan, dan Surat Peringatan. Mohon datang tepat waktu sesuai jadwal shift.\n\nTerima kasih.\n\nHormat kami,\nHR Admin Corporate\nOPA Hospitality Management`;
const picNC=(o,rows)=>`Yth. PIC ${o},\n\nBerikut rekap absensi karyawan outlet ${o}:\n\n${rows.map((k,i)=>`${i+1}. ${cap(k.nama)} (${k.jabatan||'-'}), ${dL(k.tanggal)}, Shift ${k.shift||'-'} — ${detail(k)}${k.keterangan?'. '+k.keterangan:''}`).join('\n')}\n\nMohon bantu mengingatkan karyawan terkait. PIC Outlet dapat membuat Memo Pengajuan Manual Clock kepada Direksi dengan kronologi dan dokumen pendukung (${MEMO}). Manual Clock hanya diproses setelah disetujui Direksi.\n\nMohon tindak lanjut disampaikan kembali kepada HR Corporate.\nTerima kasih.\n\nHormat kami,\nHR Admin Corp. OHM`;
const picLT=(o,rows)=>{const t=rows.reduce((a,k)=>a+mins(k),0);return`Yth. Manager / PIC ${o},\n\nBerikut rekap keterlambatan karyawan outlet ${o} periode ${BLN[rows[0].bulan-1]} ${rows[0].tahun}:\n\n${[...rows].sort((a,b)=>mins(b)-mins(a)).map((k,i)=>`${i+1}. ${cap(k.nama)} (${k.jabatan||'-'}) — ${mins(k)} menit${k.frekuensi?`, ${k.frekuensi} kali`:''}`).join('\n')}\n\nTotal: ${rows.length} karyawan, ${t} menit.\nMohon bantu mengingatkan karyawan terkait agar hadir tepat waktu dan lakukan pembinaan bila diperlukan.\n\nTerima kasih.\n\nHormat kami,\nHR Admin Corporate\nOPA Hospitality Management`};

const F={v:'ringkasan',nc:{q:'',st:'Semua',jenis:'finger',o:''},lt:{q:'',bulan:nowM().b,tahun:nowM().y,st:'Semua'},emp:{q:'',o:''},pl:{q:'',st:'Semua',t:'',o:''}};
const NAV=[['ringkasan','home','Ringkasan'],['noclock','nc','No Clock'],['terlambat','late','Terlambat'],['surat','send','Surat ke PIC'],['karyawan','users','Karyawan']];
const openCount=()=>({noclock:S.nc.filter(k=>k.status!=='Selesai').length,terlambat:S.late.filter(k=>k.status!=='Selesai').length,surat:getLetters().filter(l=>!l.sent).length});
const empty=(t,p,b)=>`<div class="card em"><h3>${t}</h3><p>${p}</p><div class="tb">${b}</div></div>`;
const outletsOf=a=>[...new Set(a.map(k=>k.outlet).filter(Boolean))].sort((x,y)=>x.localeCompare(y,'id'));
const hd=(t,p,act)=>`<div class="hd"><div><h1>${t}</h1><p>${p}</p></div><div class="sp"></div>${act||''}</div>`;
const initial=n=>esc((n||'?').trim()[0]?.toUpperCase());
const sapa=()=>{const h=+new Intl.DateTimeFormat('en-GB',{hour:'numeric',hour12:false,timeZone:WIB}).format(new Date());return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'};
const who=(k,s)=>`<div class="who"><div class="av"${avc(k.nama)}>${initial(k.nama)}</div><div><b>${esc(k.nama)}</b><small>${s||esc([k.jabatan,k.outlet].filter(Boolean).join(' · ')||'–')}</small></div></div>`;

function ringkasan(){
  if(!S.emp.length&&!S.nc.length&&!S.late.length)return hd('Selamat datang','Mulai dari data karyawan, lalu catat No Clock dan keterlambatan.')+empty('Belum ada data','Tambah karyawan, impor CSV, atau pulihkan cadangan.',`<button class="btn p" data-a="new" data-t="emp">${ic('plus')}Tambah karyawan</button><button class="btn" data-a="csv">${ic('up')}Impor CSV</button>`);
  const m=nowM(),ltM=S.late.filter(k=>k.bulan==m.b&&k.tahun==m.y),ncM=S.nc.filter(k=>{const r=perRange(m.b,m.y);return k.tanggal>=r.from&&k.tanggal<=r.to});
  const q=[['Belum dihubungi','Semua sudah dihubungi',S.nc.filter(k=>k.status==='Belum').length,'noclock','Belum','nc'],['Menunggu bukti karyawan','Tidak ada yang menunggu',S.nc.filter(k=>k.status==='Menunggu Bukti').length,'noclock','Menunggu Bukti','nc'],['Keterlambatan belum ditindak','Semua keterlambatan ditindak',S.late.filter(k=>k.status==='Belum').length,'terlambat','Belum','lt']];
  const mSum=(b,y)=>S.late.filter(k=>k.bulan==b&&k.tahun==y).reduce((a,k)=>a+mins(k),0),pm=m.b===1?{b:12,y:m.y-1}:{b:m.b-1,y:m.y},cm=mSum(m.b,m.y),pv=mSum(pm.b,pm.y),dl=pv?Math.round((cm-pv)/pv*100):null,
  trend=[5,4,3,2,1,0].map(i=>{let b=m.b-i,y=m.y;while(b<1){b+=12;y--}return{l:BLN[b-1].slice(0,3),v:mSum(b,y)}}),tmx=Math.max(1,...trend.map(x=>x.v)),
  dd=Array.from({length:14},(_,i)=>{const iso=new Intl.DateTimeFormat('en-CA',{timeZone:WIB}).format(new Date(Date.now()-(13-i)*864e5));return{iso,v:S.nc.filter(k=>k.tanggal===iso).length}}),dmx=Math.max(1,...dd.map(x=>x.v)),
  lama=S.nc.filter(k=>k.status!=='Selesai').sort((a,b)=>(a.tanggal||'').localeCompare(b.tanggal||'')).slice(0,4),oc=s=>S.nc.filter(k=>k.output===s).length,
  flow=(arr,list)=>`<div class="stk">${list.map((s,i)=>`<s class="c${i}" style="flex:${arr.filter(k=>k.status===s).length}" title="${s}"></s>`).join('')}</div><div class="lg">${list.map((s,i)=>`<span><i class="c${i}"></i>${s} <b>${arr.filter(k=>k.status===s).length}</b></span>`).join('')}</div>`;
  const os=outletsOf([...S.nc,...S.late]),rows=os.map(o=>({o,nc:S.nc.filter(k=>k.outlet===o&&k.status!=='Selesai').length,mn:ltM.filter(k=>k.outlet===o).reduce((a,k)=>a+mins(k),0)})).sort((a,b)=>b.mn-a.mn||b.nc-a.nc);
  const mx=Math.max(1,...rows.map(r=>r.mn)),top=[...ltM].sort((a,b)=>mins(b)-mins(a)).slice(0,5),tm=Math.max(1,...top.map(mins));
  return hd(sapa()+', tim HR',dL(todayISO())+' · Periode '+perTxt(m.b,m.y)+' · '+(q.reduce((a,x)=>a+x[2],0)?q.reduce((a,x)=>a+x[2],0)+' hal perlu ditindak':'Semua beres'))+
  `<div class="q">${q.map(([t,ok,n,v,s,k])=>`<button class="card qi ${n?'w':'ok'}" data-a="goto" data-v="${v}" data-k="${k}" data-s="${s}"><div class="qn" ${n?'data-cu':''}>${n||ic('ok')}</div><span>${n?t:ok}</span></button>`).join('')}</div>

const noMax=(c,y)=>{let m=0;try{const D=JSON.parse(localStorage.getItem('opa_db')||'{}');[...(D.out||[]),...(D.man||[])].forEach(x=>{const p=String(x.no||'').split('/');if(p[1]===c&&p[p.length-1]===String(y))m=Math.max(m,parseInt(p[0])||0)});m=Math.max(m,+(D.nst||{})[y+'|'+c]||0)}catch(_){}try{m=Math.max(m,+(JSON.parse(localStorage.getItem('opa-pdf-seq2')||'{}')[c+'|'+y])||0)}catch(_){}return m};

/* ===== OPA v35: Penamaan dokumen baku =====
   Pola : {Jenis Dokumen} [- {Outlet}] {TAHUN}-{NO URUT 3 digit} - {Nama Karyawan/Kandidat}.pdf
   Contoh: Surat Peringatan 2026-012 - Budi Santoso.pdf | Kontrak PKWT 2026-001 - Ani Lestari.pdf
   Tanpa nomor: {Jenis} {YYYY-MM-DD} - {Nama}. Tanpa karakter terlarang \ / : * ? " < > | agar sah di semua OS. */
const opaSan=s=>String(s==null?'':s).replace(/[\\\/:*?"<>|\u0000-\u001f]+/g,' ').replace(/\s+/g,' ').trim();
const opaTc=s=>{s=opaSan(s);return(s&&(s===s.toUpperCase()||s===s.toLowerCase()))?s.toLowerCase().replace(/(^|[\s'.-])([a-zà-ɏ])/g,(m,a,b)=>a+b.toUpperCase()):s};
function opaDocName(jenis,o){o=o||{};const no=String(o.no==null?'':o.no).trim(),tg=String(o.tgl||'').trim();
 const tk=no.split(/[\/\s]+/).filter(Boolean);let yi=-1;tk.forEach((x,i)=>{if(/^(19|20)\d{2}$/.test(x))yi=i});
 const sqT=tk.find((x,i)=>i!==yi&&/^\d{1,6}$/.test(x));
 let iso='';const a=tg.match(/^(\d{4})-(\d{2})-(\d{2})/),b=tg.match(/^(\d{2})-(\d{2})-(\d{4})/);if(a)iso=a[0].slice(0,10);else if(b)iso=b[3]+'-'+b[2]+'-'+b[1];
 const yr=yi>=0?tk[yi]:(iso?iso.slice(0,4):'');let ref;
 if(sqT)ref=(yr?yr+'-':'')+sqT.padStart(3,'0');
 else if(no)ref=opaSan(no).replace(/\s+/g,'-');
 else ref=iso||new Date().toISOString().slice(0,10);
 const ot=opaSan(o.outlet).slice(0,40).trim();let n=opaSan(jenis)+(ot?' - '+ot+' - ':' ')+ref;const nm=opaTc(o.nama).slice(0,60).trim();if(nm)n+=' - '+nm;
 return n.replace(/[. ]+$/,'')+(o.ext||'')}

function pdfSection(t,o,rows,pic,ref){
  const nc=t==='nc',now=new Date().toLocaleDateString('id-ID',{timeZone:WIB,day:'numeric',month:'long',year:'numeric'});
  rows=[...rows].sort((a,b)=>nc?(a.tanggal||'').localeCompare(b.tanggal||''):mins(b)-mins(a));
  const cn=f=>rows.filter(f).length,per0=nc?'':BLN[rows[0].bulan-1]+' '+rows[0].tahun+' ('+perTxt(rows[0].bulan,rows[0].tahun)+')';
  const sm=nc?[['Total',rows.length],['Tidak Finger IN',cn(k=>!isP(k)&&k.statusAbsen!=='Pulang'&&k.statusAbsen!=='Keduanya')],['Tidak Finger OUT',cn(k=>!isP(k)&&k.statusAbsen==='Pulang')],['Tidak IN & OUT',cn(k=>!isP(k)&&k.statusAbsen==='Keduanya')],['Pulang Awal / Lambat',cn(isP)]]:[['Karyawan',rows.length],['Total Menit',rows.reduce((a,k)=>a+mins(k),0)],['Total Kejadian',rows.reduce((a,k)=>a+(k.frekuensi||(k.hari||[]).length||0),0)]];
  const head=nc?['No','Hari, Tanggal','Nama Karyawan','Jabatan','Shift','Keterangan']:['No','Nama Karyawan','Jabatan','Kali','Total','Rincian Tanggal'];
  const tr=rows.map((k,i)=>nc?`<tr><td class="c">${i+1}</td><td>${fmtD(k.tanggal)}</td><td>${esc(cap(k.nama))}<br><small>ID ${esc(k.karyawanNo||k.no||'-')}</small></td><td>${esc(k.jabatan||'-')}</td><td>${esc(k.shift||'-')}</td><td class="tg">${isP(k)?esc((k.jenisPulang||'Pulang')+(k.waktuPulang?' · '+k.waktuPulang:'')):esc(short(k))}${k.keterangan?`<br><small style="font-weight:400;color:#333">${esc(k.keterangan)}</small>`:''}</td></tr>`
   :`<tr><td class="c">${i+1}</td><td>${esc(cap(k.nama))}<br><small>ID ${esc(k.karyawanNo||k.no||'-')}</small></td><td>${esc(k.jabatan||'-')}</td><td class="c">${k.frekuensi||(k.hari||[]).length||'-'}</td><td class="c tg">${mins(k)} mnt</td><td>${(k.hari&&k.hari.length)?[...k.hari].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).map(h=>+h.tanggal.slice(8)+' ('+h.menit+')').join(', '):'–'}</td></tr>`).join('');
  const W=nc?['9mm','31mm','','28mm','24mm','31mm']:['9mm','','30mm','12mm','18mm','38mm'];
  return `<section class="sec"><div class="ac t">${ACC_SVG()}</div><div class="ac b">${ACC_SVG(1)}</div><table class="pg"><thead><tr><td><div class="sp"></div><div class="kop"><img src="${LOGO_B64}" alt="Logo OPA"><div><div class="kn">OPA HOSPITALITY MANAGEMENT</div><div class="ka">Muara Duta Regency, Jl. Leuwi Panjang No. 61B Kav no. 15-16 RT 13 / RW 03<br>Kelurahan Situsaeur, Kecamatan Bojongloa Kidul – Kota Bandung 40235</div></div></div></td></tr></thead><tfoot><tr><td><div class="sf"></div></td></tr></tfoot><tbody><tr><td>
  <h2 class="dt">${nc?'Informasi Ketidaklengkapan Absensi Karyawan':'Informasi Keterlambatan Karyawan'}</h2><div class="dn">Nomor: <b>${esc(ref)}</b></div>
  <table class="ls"><tr><td>Kepada</td><td>:</td><td>Yth. PIC ${esc(o)}${pic.n?' – '+esc(pic.n):''}${pic.k?' ('+esc(pic.k)+')':''}</td></tr><tr><td>Dari</td><td>:</td><td>HR Corporate OPA Hospitality Management</td></tr><tr><td>Periode</td><td>:</td><td>${nc?esc(PERTXT):esc(per0)}</td></tr><tr><td>Perihal</td><td>:</td><td><b>${nc?'Rekap No Clock (Finger IN/OUT tidak terbaca)'+(rows.some(isP)?' &amp; Pulang Tidak Wajar':''):'Rekap Keterlambatan'} – ${esc(o)}</b></td></tr></table>
  <p>Dengan hormat,</p><p>Berikut informasi ${nc?'ketidaksesuaian absensi':'keterlambatan'} karyawan outlet <b>${esc(o)}</b>${nc?', diurutkan kronologis':''}:</p>
  <div class="sm">${sm.map(([a,b])=>`<div><b>${b}</b>${a}</div>`).join('')}</div>
  <table class="d"><colgroup>${W.map(w=>`<col${w?` style="width:${w}"`:''}>`).join('')}</colgroup><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${tr}</tbody></table>
  <p>${nc?`Mohon bantu mengingatkan karyawan terkait. PIC Outlet dapat mengajukan Manual Clock kepada Direksi dengan melampirkan kronologi dan dokumen pendukung (${esc(MEMO)}). Pengajuan hanya diproses setelah mendapat persetujuan Direksi.${rows.some(isP)?' Untuk karyawan yang pulang lebih awal atau di luar jam semestinya, mohon PIC mengonfirmasi alasan dan jam pulang sebenarnya.':''}`:'Mohon bantu mengingatkan karyawan terkait agar hadir tepat waktu dan lakukan pembinaan bila diperlukan.'}</p>
  <p>Demikian informasi ini kami sampaikan. Terima kasih atas perhatian dan kerja samanya.</p>
  <div class="sn">Bandung, ${now}<br>Hormat kami,<br><b>HR Admin Corp. OHM</b></div></td></tr></tbody></table></section>`}
function pdfPic(all){
  const t=form&&form.pic;if(!t)return;const nc=t==='nc',
  rows=nc?S.nc.filter(k=>k.status!=='Selesai'&&k.tanggal>=PF()&&k.tanggal<=PT()):S.late.filter(k=>k.bulan==F.lt.bulan&&k.tahun==F.lt.tahun),
  os=(all?outletsOf(rows):[$('#po').value]).filter(o=>rows.some(k=>k.outlet===o));if(!os.length)return toast('Tidak ada data pada periode ini');
  const fd=x=>dt(x,{day:'numeric',month:'long',year:'numeric'});PERTXT=nc?fd(PF())+' – '+fd(PT()):'';
  let name='Laporan Absensi';
  const m=PICMAP(),cur1=$('#po')&&$('#po').value;if(cur1)m[cur1]={n:$('#pn').value.trim(),k:$('#pk').value.trim()};localStorage.setItem('opa-pic-map',JSON.stringify(m));
  const cd=nc?'NC':'LT',cu=$('#pno')?$('#pno').value.trim():'',pk0=peekNo(cd);
  const LET=os.map((o,i)=>{const rr=rows.filter(k=>k.outlet===o),ref=(os.length===1&&cu&&cu!==pk0)?cu:takeNo(cd);return{id:'LAP'+Date.now().toString(36)+i,no:ref,outlet:o,t,tgl:todayISO(),n:rr.length,pic:m[o]||{},sec:pdfSection(t,o,rr,m[o]||{},ref),sent:false}});
  const html=LET.map(l=>l.sec).join('');
  try{opaLog('Membuat laporan '+(nc?'No Clock':'Keterlambatan')+' ke PIC: '+LET.map(l=>l.outlet+' ('+l.no+')').join(', '),'abs')}catch(e){}
  const lname=l=>opaDocName('Laporan '+(l.t==='nc'?'No Clock':'Terlambat'),{no:l.no,tgl:l.tgl,outlet:l.outlet});
  name=LET.length===1?lname(LET[0]):opaDocName('Laporan '+(nc?'No Clock':'Terlambat'),{no:LET[0].no,tgl:LET[0].tgl,outlet:'Semua Outlet'});
  saveLetters(LET.map(l=>({id:l.id,no:l.no,outlet:l.outlet,t:l.t,tgl:l.tgl,n:l.n,pic:l.pic,sent:false,html:`<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>${esc(lname(l))}</title><style>${PDFCSS}</style></head><body>${l.sec}</body></html>`})));
  if($('#pno'))$('#pno').value=peekNo(cd);renderPls();const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  f.srcdoc=`<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>${esc(name)}</title><style>${PDFCSS}</style></head><body>${html}</body></html>`;
  f.onload=()=>{setTimeout(()=>{f.contentWindow.focus();const old=document.title;opaSetTitle(name);f.contentWindow.print();document.title=old;opaResetTitle();setTimeout(()=>f.remove(),60000)},300)};toast('Surat tercatat di menu Surat ke PIC. Pilih "Simpan sebagai PDF" pada dialog cetak');
}

async function delLetter(id){const A=getLetters(),l=A.find(x=>x.id===id);if(!l||l.sent)return;if(!await opaConfirm('Hapus surat '+l.no+'? Nomor surat tetap tercatat terpakai.'))return;try{localStorage.setItem(LETKEY,JSON.stringify(A.filter(x=>x.id!==id)))}catch(e){return toast('Gagal menghapus surat')}render();toast('Surat dihapus')}

function picDialog(t){const nc=t==='nc',rows=nc?S.nc.filter(k=>k.status!=='Selesai'):S.late.filter(k=>k.bulan==F.lt.bulan&&k.tahun==F.lt.tahun),os=outletsOf(rows);form={pic:t};
  $('#fm').innerHTML=`<h2>Rekap untuk PIC outlet</h2><p class="mu">${nc?'Kasus No Clock yang belum selesai':'Keterlambatan '+BLN[F.lt.bulan-1]+' '+F.lt.tahun}. Pilih outlet, lalu salin pesan.</p>${os.length?`<select class="in" id="po" aria-label="Outlet">${os.map(o=>`<option>${esc(o)}</option>`).join('')}</select><div class="r2" style="margin:8px 0"><div><label>Nama PIC</label><input class="in" id="pn"></div><div><label>Kontak PIC</label><input class="in" id="pk" inputmode="tel"></div></div>${nc?`<div class="r2" style="margin:8px 0"><div><label>Periode dari</label><input class="in" type="date" id="pf" value="${perRange(nowM().b,nowM().y).from}"></div><div><label>Sampai</label><input class="in" type="date" id="pt" value="${perRange(nowM().b,nowM().y).to}"></div></div>`:''}<div style="margin:8px 0"><label>Nomor surat <small>(otomatis; bisa diubah jika satu outlet)</small></label><input class="in" id="pno"></div><textarea class="msg" id="pm" style="min-height:200px"></textarea><p class="mu" style="margin-top:8px">Status pengiriman surat dipantau di menu <b>Surat ke PIC</b>.</p>`:'<p>Tidak ada data untuk direkap.</p>'}<div class="df"><button type="button" class="btn" data-a="dclose">Tutup</button>${os.length?`<button type="button" class="btn" data-a="cp" data-s="#pm">${ic('copy')}Salin</button><button type="button" class="btn" data-a="pdfall">${ic('down')}PDF semua outlet</button><button type="button" class="btn p" data-a="pdf">${ic('down')}Unduh PDF</button>`:''}</div>`;
  const fill=()=>{const o=$('#po').value,r=rows.filter(k=>k.outlet===o);$('#pm').value=(nc?picNC:picLT)(o,r);const p=PICMAP()[o]||{};$('#pn').value=p.n||'';$('#pk').value=p.k||'';$('#pno').value=peekNo(nc?'NC':'LT')};if(os.length){$('#po').onchange=fill;fill()}$('#dg').showModal()}

const csvParse=txt=>{txt=txt.replace(/^\uFEFF/,'');const l1=txt.split(/\r?\n/)[0]||'',dl=l1.includes('\t')?'\t':(l1.match(/;/g)||[]).length>(l1.match(/,/g)||[]).length?';':',',rows=[];let r=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];if(c==='"'){if(q&&txt[i+1]==='"'){f+='"';i++}else q=!q}else if(c===dl&&!q){r.push(f.trim());f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&txt[i+1]==='\n')i++;r.push(f.trim());f='';if(r.some(Boolean))rows.push(r);r=[]}else f+=c}
  r.push(f.trim());if(r.some(Boolean))rows.push(r);return rows};
function importCsv(file){const rd=new FileReader();rd.onload=()=>{const rows=csvParse(String(rd.result)),n=s=>s.toLowerCase().replace(/[^a-z]/g,''),h=rows[0].map(n),has=h.includes('nama')||h.includes('namakaryawan'),ix=(...a)=>h.findIndex(x=>a.includes(x)),
  m=has?{nama:ix('nama','namakaryawan'),no:ix('no','nomor','nik','nokaryawan'),hp:ix('hp','nohp','whatsapp','telepon'),email:ix('email'),jabatan:ix('jabatan','posisi'),outlet:ix('outlet','hotel','lokasi')}:{nama:0,no:1,hp:2,email:3,jabatan:4,outlet:5};
  const have=new Set(S.emp.map(e=>e.no));let add=0;(has?rows.slice(1):rows).forEach(c=>{const g=k=>m[k]>=0?(c[m[k]]||'').trim():'',nama=g('nama');if(!nama)return;const no=g('no')||gid();if(have.has(no))return;have.add(no);S.emp.push({nama,no,hp:g('hp'),hp_clean:dg(g('hp')),email:g('email'),jabatan:g('jabatan'),outlet:g('outlet')});add++});
  save();render();toast(add?`${add} karyawan diimpor`:'Tidak ada karyawan baru ditemukan')};rd.readAsText(file)}

function backup(){const b=new Blob([JSON.stringify({app:'OPA Hospitality — No Clock & Terlambat',version:'22',exportedAt:new Date().toISOString(),karyawan:S.emp,kasus:S.nc,keterlambatan:{kasus:S.late}},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`opa-no-clock-terlambat-${todayISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Cadangan data diunduh')}
function restore(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),ok=x=>Array.isArray(x)?x.filter(i=>i&&typeof i==='object').map(i=>({...i,id:i.id||gid()})):null;
  const e=Array.isArray(d.karyawan)?d.karyawan.filter(i=>i&&i.nama):null,n=ok(d.kasus),l=ok(d.keterlambatan&&d.keterlambatan.kasus);if(!e&&!n&&!l)throw 0;
  if(e)S.emp=e.map(i=>({...i,no:String(i.no||gid()),hp_clean:dg(i.hp||i.hp_clean)}));if(n&&!(l===null&&n.some(i=>i.totalMenit!==undefined)))S.nc=n;if(l)S.late=l;save();render();toast('Data berhasil dipulihkan')}catch{toast('File cadangan tidak valid')}};r.readAsText(file)}

let armed=null;
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,{t,id}=el.dataset;
  if(a==='restore')return;if(a!=='del'&&armed){armed=null}
  if(a==='goto'){F.v=el.dataset.v;if(el.dataset.k)F[el.dataset.k].st=el.dataset.s;history.replaceState(null,'','#'+F.v);closeDr();render();scrollTo(0,0)}
  else if(a==='set'){const[g,k]=el.dataset.k.split('.');F[g][k]=el.dataset.v;render()}
  else if(a==='open'){if(ev.target.closest('[data-a=wa]'))return;drawer(t,id)}
  else if(a==='addday'){const r=find('late',id);PRE=r?r.nama+' · '+(r.karyawanNo||r.no):'';openForm('late')}
  else if(a==='dset'){const i=$('#ldate');i.value=new Intl.DateTimeFormat('en-CA',{timeZone:WIB}).format(new Date(Date.now()-(+el.dataset.d)*864e5));lper()}
  else if(a==='delday'){const r=find('late',id);if(r&&r.hari){snap();r.hari=r.hari.filter(h=>h.tanggal!==el.dataset.d);recalc(r);if(!r.hari.length&&!r.dasarMenit)S.late=S.late.filter(x=>x!==r);save();refresh();if(find('late',id))drawer('late',id);else closeDr();toast('Tanggal dihapus',1)}}
  else if(a==='imp')impDialog(t);else if(a==='doimp')doImp();else if(a==='sample')sample(t);else if(a==='prof')profile(id);else if(a==='close')closeDr();else if(a==='dclose')$('#dg').close();
  else if(a==='wa'){ev.stopPropagation();sendWa(t,id)}
  else if(a==='upd'){snap();try{const _k=find(cur.t,cur.id);opaLog('Memperbarui '+(cur.t==='nc'?'No Clock':'Keterlambatan')+' '+(_k?_k.nama+' ('+_k.outlet+')':'')+(el.dataset.f==='status'?' menjadi '+el.dataset.v:''),'abs')}catch(e){}upd(cur.t,cur.id,el.dataset.f,el.dataset.v);drawer(cur.t,cur.id);refresh();toast('Status diperbarui',1)}
  else if(a==='undo'){if(US){const o=JSON.parse(US);S.emp=o.emp;S.nc=o.nc;S.late=o.late;US=null;save();render();if(cur&&find(cur.t,cur.id))drawer(cur.t,cur.id);else closeDr();$('#ts').classList.remove('on')}}
  else if(a==='cp'){const s=$(el.dataset.s||'#mg');navigator.clipboard?.writeText(s.value).then(()=>toast('Pesan disalin'),()=>{s.select();document.execCommand('copy');toast('Pesan disalin')})}
  else if(a==='new')openForm(t);else if(a==='edit'){const k=t==='emp'?S.emp.find(x=>x.no===id):find(t,id);openForm(t,k)}
  else if(a==='pic')picDialog(t);else if(a==='pdf')pdfPic(false);else if(a==='pdfall')pdfPic(true);else if(a==='plsent')markSent(el.dataset.id);else if(a==='letview')viewLetter(el.dataset.id);else if(a==='pldel')delLetter(el.dataset.id);else if(a==='csv')$('#csv').click();else if(a==='backup')backup();
  else if(a==='del'){snap();S[t]=S[t].filter(k=>k.id!==id);save();closeDr();render();toast('Kasus dihapus',1)}});
document.addEventListener('input',ev=>{const f=ev.target.dataset.f;if(!f)return;const[g,k]=f.split('.');F[g][k]=ev.target.value;if(ev.target.tagName==='INPUT')refresh();else render()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeDr();if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.row[role=button]')){ev.preventDefault();ev.target.click()}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.name==='jenisKasus'){const p=t.value==='Pulang tidak terbaca sistem';$('#f1').classList.toggle('hid',p);$('#f2').classList.toggle('hid',!p)}if(t.dataset.a==='restore'&&t.files[0]){restore(t.files[0]);t.value=''}});
$('#csv').onchange=e=>{if(e.target.files[0])importCsv(e.target.files[0]);e.target.value=''};
$('#fm').onsubmit=e=>{if(form&&(form.pic||form.imp))return e.preventDefault();submitForm(e)};
document.addEventListener('change',e=>{if(e.target.id==='ifile'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{$('#ipaste').value=r.result;impPrev()};r.readAsText(e.target.files[0])}});
document.addEventListener('input',e=>{if(e.target.id==='ipaste')impPrev()});

const h=location.hash.slice(1);if(V[h])F.v=h;window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(V[v]&&v!==F.v){F.v=v;render()}});
render();save();
