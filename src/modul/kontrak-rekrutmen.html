<script>
const SEED=[],LEGAL={"PKWT":[["A","1","PENEMPATAN"],["C","1","Pihak Pertama bersedia menerima Pihak Kedua sebagai pekerja kontrak waktu tertentu di bagian {{dep}} sebagai / Jabatan <b>{{pos}}<\/b>."],["C","2","Pihak Pertama mempunyai wewenang sepenuhnya untuk menempatkan atau memindahkan Pihak Kedua pada tugas atau pekerjaan dan atau departemen / bagian lain sesuai kebutuhan perusahaan."],["A","2","MASA PERJANJIAN KERJA"],["C","1","Perjanjian Kerja Waktu Tertentu (PKWT) ini berlaku dan atau berlangsung selama-lamanya {{dur}}, terhitung dimulai pada tanggal {{start}} dan berakhir pada tanggal {{end}}."],["C","2","Selama menjalani masa Perjanjian Kerja Waktu Tertentu (PKWT), Pihak Pertama akan melakukan penilaian atau evaluasi terhadap hasil kerja Pihak Kedua dan hasil penilaian tersebut akan menentukan hubungan kerja selanjutnya."],["A","3","HARI KERJA, JAM KERJA, DAN HARI LIBUR"],["C","1","Hari kerja adalah 6 (enam) hari kerja dalam seminggu atau 40 jam dalam seminggu."],["C","2","Jam kerja adalah sesuai jam yang berlaku di perusahaan, dan kerja shift, serta karyawan wajib melakukan fingerprint/absensi."],["C","3","Hari libur jatuh pada hari Minggu dan hari libur resmi yang ditetapkan oleh pemerintah (khusus untuk karyawan/ti Back Office), dan untuk hari libur bagi karyawan/ti operasional disesuaikan dengan jadwal libur yang telah ditetapkan dan diatur oleh penanggung jawab outlet terkait."],["PAYART"],["A","5","LEMBUR DAN PEMBAYARAN UPAH"],["C","1","Jika kepentingan Pihak Pertama memerlukan, Pihak Kedua wajib bekerja di luar jam atau hari kerja dengan memperoleh upah lembur sesuai dengan ketentuan yang berlaku."],["C","2","Pihak Kedua menerima upah kerja lembur pada setiap tanggal 1 (satu) bulan berikutnya melalui transfer pada bank yang telah ditentukan oleh perusahaan."],["C","3","Sistem pengupahan ini dapat dirubah oleh Pihak Pertama yang disesuaikan dengan program perusahaan dengan memperhatikan ketentuan atau peraturan yang berlaku."],["C","4","Kerja Lembur yang dimaksud di atas harus mendapatkan persetujuan tertulis (Surat perintah lembur / SPL) dari Pihak Pertama terlebih dahulu. Tanpa persetujuan dimaksud, Pihak Kedua tidak berhak melaksanakan kerja lembur dan upah lembur."],["A","6","HAK DAN KEWAJIBAN"],["C","1","Pihak Kedua berhak untuk mendapatkan perlakuan yang layak dari Pihak Pertama tanpa diskriminasi dalam menjalankan tugas pekerjaan."],["C","2","Pihak Kedua berhak menerima upah sesuai dengan yang telah ditetapkan oleh Pihak Pertama."],["C","3","Pihak Kedua wajib hadir dan menjalankan tugasnya selambat-lambatnya 10 (sepuluh) menit sebelum jam kerja dimulai serta menggunakan waktu sebaik-baiknya sampai jam kerja berakhir."],["C","4","Pihak Kedua wajib melaksanakan dan mematuhi semua ketentuan atau peraturan, perintah, petunjuk, pengarahan, dan instruksi yang berlaku baik yang telah dikeluarkan dan termuat dalam ketentuan atau peraturan yang berlaku secara umum, maupun yang belum dikeluarkan secara resmi oleh Pihak Pertama sepanjang tidak bertentangan dengan ketentuan hukum yang berlaku."],["C","5","Pihak Kedua wajib untuk bekerja dengan tekun, rajin, jujur, dan penuh dedikasi serta loyalitas kepada Pihak Pertama."],["C","6","Pihak kedua wajib menolak setiap pemberian atau janji atau perlakuan yang diberikan oleh siapapun juga atau melakukan perbuatan yang berakibat langsung ataupun tidak langsung merugikan perusahaan Pihak Pertama, baik materil maupun non materil."],["C","7","Pihak Kedua wajib menolak atau tidak melakukan pekerjaan di luar perusahaan yang sama atau sejenis dengan kegiatan perusahaan Pihak Pertama, yang dapat merugikan perusahaan baik langsung maupun tidak langsung."],["C","8","Pihak Kedua wajib memegang teguh rahasia perusahaan Pihak Pertama baik yang dipercayakan secara khusus kepadanya maupun yang harus dipegang teguh oleh karyawan/ti pada umumnya, dengan menjaga nama baik perusahaan baik di luar maupun di dalam perusahaan."],["C","9","Pihak Kedua wajib menjaga, menyimpan, dan memelihara barang-barang atau inventaris termasuk surat-surat dan dokumen-dokumen milik atau berada dalam penguasaan perusahaan Pihak Pertama."],["C","10","Pihak Kedua wajib menghormati, bersikap ramah tamah, dan sopan santun dalam berhubungan dengan karyawan Pihak Pertama yang lain."],["C","11","Pihak Kedua wajib menghindari perbuatan yang tercela, seperti membuat keributan, keonaran, pertengkaran, perkelahian, asusila, dan lain-lain yang berakibat mengganggu ketertiban, kelancaran, dan ketenangan bekerja dalam perusahaan Pihak Pertama."],["A","7","PELANGGARAN / SANKSI"],["P","Pihak Pertama dapat memutuskan hubungan kerja secara sepihak dengan Pihak Kedua tanpa adanya kewajiban untuk memberikan kompensasi dalam bentuk apapun dan tanpa ada tuntutan hukum apapun baik secara hukum perdata maupun pidana dari pihak Kedua terhadap Management sebagai Pihak Pertama, apabila Pihak Kedua melakukan perbuatan dan/atau pelanggaran atas TATA TERTIB PERUSAHAAN yang telah ditetapkan, namun tidak terbatas pada hal-hal sebagai berikut:"],["C","1","Memberikan keterangan-keterangan yang tidak benar/palsu pada waktu melamar pekerjaan kepada Pihak Pertama."],["C","2","Jika Pihak Kedua terbukti secara sah melakukan pelanggaran berupa pembocoran rahasia perusahaan kepada Pihak Ketiga."],["C","3","Membocorkan rahasia Pihak Pertama, atau rumah tangga atasan kepada pihak luar."],["C","4","Tidur pada saat jam kerja."],["C","5","Jika Pihak Kedua terbukti melakukan kegiatan usaha lain di luar kewajibannya pada waktu-waktu kerja yang telah disepakati."],["C","6","Jika Pihak Kedua terbukti mangkir selama 5 (lima) hari berturut-turut tanpa keterangan tertulis yang dilengkapi dengan bukti yang sah dan telah dipanggil oleh Pihak Pertama 2 (dua) kali secara patut dan tertulis dapat diputuskan hubungan kerjanya karena dikualifikasikan mengundurkan diri, sesuai dengan UU Ketenagakerjaan No. 13/2003 Pasal 168."],["C","7","Jika Pihak Kedua terbukti secara sah melakukan tindakan-tindakan melanggar hukum seperti mencuri, menggelapkan uang dan/atau tindakan-tindakan lainnya yang melanggar norma-norma kepatutan serta melakukan tindakan-tindakan melanggar hukum lainnya. Dengan didukung bukti-bukti sebagai berikut: (a) tertangkap tangan; (b) ada pengakuan dari pekerja yang bersangkutan; (c) bukti lain berupa laporan kejadian yang dibuat oleh pihak yang berwenang di perusahaan yang bersangkutan dan didukung oleh sekurang-kurangnya 2 (dua) orang saksi."],["C","8","Mabuk karena minuman keras, morphin, dan sejenisnya pada waktu menjalankan tugas."],["C","9","Membujuk karyawan lain untuk melakukan sesuatu yang bertentangan dengan hukum dan atau norma kesusilaan."],["C","10","Dengan sengaja atau karena kelalaiannya menyebabkan cedera terhadap diri sendiri atau orang lain."],["C","11","Dengan sengaja atau karena kelalaiannya melakukan kerusakan atau perbuatan lainnya yang merugikan atau merusak nama baik perusahaan."],["C","12","Berkelahi di dalam lingkungan pekerjaan."],["C","13","Menyalahgunakan jabatan untuk kepentingan pribadi, keluarganya atau orang lain dengan merugikan perusahaan."],["C","14","Membawa senjata api, senjata tajam atau alat-alat lainnya yang dapat membahayakan orang lain tanpa seizin dari pihak yang berwajib ke dalam perusahaan dan atau tempat ia bekerja."],["C","15","Mengancam Direksi, menghina secara kasar atau menganiaya atasan atau pegawai lainnya serta tamu Pihak Pertama."],["C","16","Berkali-kali melakukan pelanggaran tata tertib/atau tidak mengindahkan perintah atasannya yang sudah ditetapkan."],["C","17","Dengan sengaja atau karena lalai sehingga mengakibatkan dirinya berada dalam keadaan sedemikian rupa sehingga tidak dapat menjalankan pekerjaannya."],["C","18","Main judi di lingkungan perusahaan tempat yang bersangkutan bekerja."],["A","8","PEMUTUSAN HUBUNGAN KERJA"],["P","Pemutusan hubungan kerja akan dilakukan, jika:"],["C","1","Pihak Kedua meninggal dunia."],["C","2","Batas waktu yang telah ditetapkan dalam perjanjian kerja waktu tertentu (PKWT) ini telah berakhir."],["C","3","Pihak Kedua diputuskan hubungan kerjanya oleh Pihak Pertama dengan alasan mendesak, karena melakukan pelanggaran berat dan Peraturan Perusahaan."],["C","4","Kesehatan Pihak Kedua tidak mengizinkan berdasarkan keterangan dokter."],["C","5","Apabila kondisi beban pekerjaan proyek yang diberikan oleh pemberi tugas benar-benar sangat berkurang atau bahkan sudah diberhentikan sama sekali, sehingga tidak ada pekerjaan yang dapat ditangani oleh Pihak Kedua."],["C","6","Kedua belah pihak bisa saling mengakhiri hubungan kerja karena alasan tertentu dengan menyampaikan secara tertulis satu bulan sebelumnya."],["P","Dengan berakhirnya hubungan kerja karena alasan-alasan seperti tersebut dalam Pasal 8 ayat (1) sampai dengan ayat (6) di atas, maka Pihak Kedua tidak akan menuntut kompensasi dalam bentuk apapun juga dari Pihak Pertama."],["A","9","PERSELISIHAN DAN DOMISILI HUKUM"],["C","1","Semua perselisihan dan/atau persengketaan yang timbul sehubungan dengan pelaksanaan perjanjian ini harus diselesaikan terlebih dahulu oleh Kedua Belah Pihak secara musyawarah untuk mencapai mufakat, dalam suasana damai, dan kekeluargaan dengan itikad baik untuk menyelesaikannya."],["C","2","Apabila penyelesaian secara musyawarah tidak dapat dicapai, maka Kedua belah pihak sepakat untuk menyelesaikannya melalui {{court}}."],["A","10","LAIN-LAIN"],["C","1","Pihak Pertama diwajibkan untuk memberitahukan kepada Pihak Kedua secara tertulis 7 (tujuh) hari sebelum masa perjanjian Kesepakatan Kerja Waktu Tertentu (PKWT) ini berakhir, apakah Perjanjian Kerja Waktu Tertentu ini akan diperpanjang atau diakhiri, dan sebaliknya."],["C","2","Pihak Kedua wajib memberitahukan secara tertulis 1 (satu) bulan sebelumnya apabila bermaksud memutuskan hubungan kerja atau mengundurkan diri."],["C","3","Jika Pihak Kedua mengakhiri hubungan kerja sepihak tanpa persetujuan dari Pihak Pertama sebelum berakhirnya masa kontrak, maka Pihak Kedua wajib membayar kepada perusahaan sejumlah upah yang diterima, yang dihitung berdasarkan sisa masa kontrak."],["C","4","Perubahan-perubahan yang dirasakan perlu oleh Pihak Pertama di kemudian hari akan dilaksanakan atas dasar kesepakatan Kedua Belah Pihak dan akan dituangkan dalam bentuk addendum yang merupakan satu kesatuan yang tidak terpisahkan dari Perjanjian Kerja ini dan memiliki kekuatan hukum yang sama."],["P","Demikian kesepakatan kerja ini dibuat dan ditandatangani oleh Kedua Belah Pihak, atas dasar itikad baik. Kedua Belah Pihak telah membaca dan memahami sepenuhnya surat perjanjian ini dalam keadaan sehat jasmani dan rohani, sadar, dimengerti, dan dipahami tanpa tekanan dari pihak siapapun."]],"DHL":[["P","Kedua belah pihak bersepakat untuk mengadakan kesepakatan kerja harian dengan ketentuan sebagai berikut:"],["C","1","Pihak Pertama menerima Pihak Kedua sebagai tenaga kerja harian lepas pada {{co}} di outlet {{out}} yang berlokasi di {{addr}}, dengan tugas dan tanggung jawab sebagai {{pos}}."],["C","2","Pihak Pertama mempunyai wewenang sepenuhnya untuk menempatkan atau memindahkan Pihak Kedua pada tugas atau pekerjaan dan atau departemen / bagian lain sesuai kebutuhan perusahaan."],["C","3","Perjanjian kerja ini dibuat terhitung mulai {{start}} sampai dengan {{end}}."],["C","4","Penentuan hari kerja dan jam kerja Pihak Kedua akan diatur sepenuhnya oleh Pihak Pertama. Oleh karena itu Pihak Kedua sepakat untuk tunduk dan patuh kepada peraturan dan ketentuan yang dikeluarkan oleh Pihak Pertama."],["C","5","Pihak Kedua berhak atas upah yang dibayarkan oleh Pihak Pertama sebesar Rp {{wage}} per satu hari kerja. Satu hari kerja adalah 8 jam kerja (termasuk 1 jam istirahat)."],["C","6","Lembur diberlakukan apabila Pihak Kedua telah bekerja lebih dari 8 jam / hari atas permintaan Kepala Bagian yang bersangkutan dengan persetujuan tertulis dari Pimpinan / Penanggung jawab Outlet."],["C","7","Pihak Kedua mendapat hak makan 1 (satu) kali per satu hari kerja sebesar Rp {{meal}}."],["C","8","Pihak Kedua wajib mentaati dan melaksanakan peraturan yang berlaku di Perusahaan."],["C","9","Kedua pihak dapat memutuskan Perjanjian Kerja ini sewaktu-waktu apabila diperlukan dan tidak ada kompensasi dalam bentuk apapun."],["P","<b>10. Perjanjian kerja ini berakhir bilamana:<\/b>"],["C","10.1","Pekerjaan berdasarkan kebutuhan telah selesai dipekerjakan."],["C","10.2","Pihak Kedua melakukan pelanggaran atas Peraturan Perusahaan yang berlaku."],["C","10.3","Pihak Kedua dinilai tidak cakap dalam melaksanakan pekerjaannya."],["C","10.4","Atas kehendak pengunduran diri secara sukarela dari Pihak Kedua."],["C","10.5","Berakhirnya batas waktu yang telah disepakati dalam Perjanjian Kerja ini."],["C","10.6","Berdasarkan pertimbangan kondisi serta situasi Perusahaan maka Pihak Pertama berhak mengakhiri Perjanjian Kerja ini tanpa ada kewajiban bagi Pihak Pertama untuk memberikan kompensasi dalam bentuk apapun pada Pihak Kedua."],["P","Perjanjian Kerja ini dapat diperbaharui atas kesepakatan kedua pihak."],["P","Perjanjian Kerja ini dibuat dan ditandatangani oleh kedua pihak secara sadar tanpa adanya paksaan atau tekanan dari pihak manapun dan berlaku sejak ditandatangani oleh kedua pihak."]]},LOGO='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEA3ADcAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCADdAN0DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8 , dengan tugas dan tanggung jawab sebagai <b>{{pos}}</b>."], ["C", 1, "Pihak Pertama mempunyai wewenang sepenuhnya untuk menempatkan atau memindahkan Pihak Kedua pada tugas atau pekerjaan dan atau departemen / bagian lain sesuai kebutuhan perusahaan."], ["C", 1, "Kesepakatan kerja ini dibuat terhitung mulai tanggal <b>{{start}} sampai dengan {{end}}</b>"], ["C", 1, "Kesepakatan Kerja Bagi Pekerja Harian Lepas ini dapat diperpanjang kembali dalam jangka waktu tertentu yang akan ditentukan kemudian, dengan ketentuan Pihak Pertama memberitahukan kepada Pihak Kedua selambat-lambatnya 7 (tujuh) hari sebelum kesepakatan berakhir dan Kepala Bagian Departemen memberi persetujuan secara tertulis."], ["C", 1, "Penentuan hari kerja dan jam kerja Pihak Kedua akan diatur sepenuhnya oleh Pihak Pertama. Oleh karena itu Pihak Kedua sepakat untuk tunduk dan patuh kepada peraturan dan ketentuan yang dikeluarkan oleh Pihak Pertama."], ["C", 1, "@W"], ["C", 1, "Pihak Kedua mendapat hak penggantian uang makan 1 (satu) kali per satu hari kerja sebesar <b>Rp. {{meal}},-</b>", "meal"], ["C", 1, "Pihak Kedua wajib mentaati dan melaksanakan peraturan yang berlaku di Perusahaan."], ["C", 1, "Kedua pihak dapat memutuskan Kesepakatan Kerja ini sewaktu-waktu apabila diperlukan dan tidak ada kompensasi apapun dalam hal ini."], ["C", 1, "Perjanjian kerja ini berakhir bilamana :"], ["C", 2, "Pekerjaan berdasarkan kebutuhan telah selesai dipekerjakan,"], ["C", 2, "Pihak Kedua melakukan pelanggaran atas Peraturan Perusahaan yang berlaku,"], ["C", 2, "Pihak Kedua dinilai tidak cakap dalam melaksanakan pekerjaannya,"], ["C", 2, "Atas kehendak pengunduran diri secara sukarela dari Pihak Kedua,"], ["C", 2, "Berakhirnya batas waktu yang telah disepakati dalam Kesepakatan Kerja ini,"], ["C", 2, "Berdasarkan pertimbangan kondisi serta situasi Perusahaan maka Pihak Pertama berhak mengakhiri Kesepakatan Kerja ini tanpa ada kewajiban bagi Pihak Pertama untuk memberikan kompensasi dalam bentuk apapun pada Pihak Kedua."], ["P", "Kesepakatan Kerja ini dapat diperbaharui atas kesepakatan kedua pihak."], ["P", "Kesepakatan Kerja ini dibuat dan ditandatangani oleh kedua pihak secara sadar tanpa adanya paksaan atau tekanan dari pihak manapun dan berlaku sejak ditandatangani oleh kedua pihak."]],JDD="1. FUNGSI\n  Di bawah pedoman umum dari Owner, Owner Representative dan atau Direktur Operasional OPA HOSPITALITY MANAGEMENT (OHM) yang ditunjuk dalam kebijakan dan Prosedur Perusahaan, bertindak sebagai {{pos}}. mengarahkan seluruh kegiatan Management perhotelan dan spa, dan menilai, mengevaluasi dan memenuhi kebutuhan jangka pendek dan jangka panjang dari hotel & spa untuk memastikan keberhasilannya. Menunjukkan kinerja yang bagus dengan mempergunakan seluruh kemampuan untuk pencapaian target yang telah ditetapkan perusahaan\n2. TUGAS\na. Melapor secara langsung kepada Direktur Operasional OPA HOSPITALITY MANAGEMENT (OHM) yang ditunjuk.\nb. Mengawasi secara langsung maupun tidak langsung bawahannya.\nc. Berinteraksi dengan para tamu dan individu di luar hotel atau perusahaan namun tidak terbatas pada klien saat ini dan klien potensial, perwakilan dari pemilik perusahaan, pemasok, pesaing, dan komunitas lokal.\nd. Mengkoordinasikan fungsi dan aktivitas dengan staff OHM, dan berfungsi sebagai regional office dan corporate dari OHM.\n3. TANGGUNG JAWAB\na. Mengembangkan dan menerapkan rencana strategis, rencana pemasaran, rencana penghematan anggaran, biaya, beban dan program tujuan untuk memastikan kepuasan tamu yang optimal secara terus menerus, potensi penjualan dan keuntungan. Pihak kedua juga meninjau dan mengkonsolidasikan anggaran tahunan untuk berbagai departemen.\nb. Memastikan kepuasan tamu pada tingkatan yang tertinggi dengan menyediakan pelayanan tamu dan fasilitas yang berkualitas sesuai dengan standar perusahaan.\nc. Mengatur seluruh fungsi personil hotel/ perusahaan melalui pengawasan terhadap bawahannya dan secara langsung maupun tidak langsung terhadap kepala departemen. Dia mengadakan briefing pagi harian, rapat, komite eksekutif mingguan, rapat kepala departemen, rapat anggaran tahunan dan inspeksi hotel secara teratur.\nd. Memantau tren saat ini dan yang akan datang, praktek dan sistem pada industri perhotelan, menentukan dan memastikan pelaksanaan program yang kompetitif.\ne. Berpartisipasi secara aktif dalam penjualan hotel, retail melalui keterlibatan pribadi dengan seluruh pasar yang potensial.\nf. Mengadakan inspeksi mingguan dan memastikan seluruh fasilitas fisik berada dalam kondisi optimal dengan program implementasi penuh atau pemeliharaan preventif, pengelolaan dan perencanaan yang bijaksana terhadap Fasilitas Fisik& Equipment.\ng. Mengawasi dan mengarahkan fungsi personil hotel termasuk rekrutmen, orientasi, pelatihan, penyuluhan, pelatihan, administrasi upah dan gaji, hubungan tenaga kerja, penilaian kinerja dan rencana suksesi.\nh. Setiap rekrutmen baru, pemberhentian, promosi dan demosi karyawan OPA Hospitality Management harus memperoleh persetujuan terlebih dahulu dari PIHAK PERTAMA\ni. Membangun dan memelihara hubungan antar karyawan yang efektif.\nj. Bertanggung jawab untuk keamanan dan keselamatan tamu dan karyawan,serta memastikan prosedur darurat ditetapkan, tetap sesuai dengan keadaan saat ini, dipublikasikan dengan baik, dipraktekkan dan ditegakkan.\nk. Memantau hukum dan peraturan yang berlaku termasuk lingkungan, kesehatan dan keselamatan serta memastikan kepatuhan.\nl. Membangun dan memelihara komunikasi internal, struktur pertemuan yang efektif untuk memastikan produktivitas dan kerjasama tim yang optimal.\nm. Membangun dan memelihara tingkat visibilitas yang terkemuka, keterlibatan pada properti dan pada bisnis, sosial dan komunitas pemerintahan.\nn. Secara tepat mengawasi manajemen kas termasuk jadwal pembayaran, persediaan dan piutang. Dia juga menyetujui pengeluaran.\no. Mengembangkan program pengakuan, iklan dan kampanye promosi untuk mendapatkan kesadaran pasar yang besar.\np. Mengimplementasikan dan memonitor Program Penghematan Biaya,Meninjau Program Konservasi Energi untuk memastikan keuntungan yang baik, konsumsi energy dan utilitas yang minimal tanpa mengorbankan standard dan kenyamanan manusia.\nq. Bertanggung jawab dalam menjalankan bisnis dan tingkat keuntungan dari seluruh departemen yang beroperasi seperti yang diarahkan oleh perusahaan.\nr. Memonitor praktek pembelian untuk memastikan kepatuhan dengan kebijakan dan petunjuk Direktur Operasional OHM yang ditunjuk.\ns. Berkontribusi terhadap pertumbuhan OHM dengan mengidentifikasi dan mengkomunikasikan kesempatan-kesempatan pengembangan yang potensial.\nt. Menetapkan dan memelihara komunikasi yang efektif dengan perusahaan pemilik dan menyadari sepenuhnya terhadap struktur organisasi dan operasi.\nu. Memastikan bahwa kebijakan etika dan peraturan hiburan dikonfirmasi oleh staf.\nv. Dalam situasi apapun tidak diperbolehkan memberikan hiburan atau hal yang bersifat gratis kepada relasi, teman atau individu atau institusi lain yang tidak ada hubungannya secara langsung untuk kesejahteraan atau kemajuan hotel.\nw. Pasangan dari Karyawan lebih disarankan untuk tinggal di hotel dengan Karyawan.\nx. Melakukan tugas lain seperti yang ditentukan oleh kebutuhan dari properti atau yang diarahkan oleh atasan.";

async function opa7CompressImage(file){const orig=file.size;const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=dataUrl});function toJpeg(maxW,q){const scale=Math.min(1,maxW/Math.max(img.width,img.height));const w=Math.max(1,Math.round(img.width*scale));const h=Math.max(1,Math.round(img.height*scale));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);const out=cv.toDataURL('image/jpeg',q);const sz=Math.round((out.length-22)*0.75);return {dataUrl:out,size:sz,width:w,height:h}}let out=toJpeg(1280,0.72);if(out.size>1500000)out=toJpeg(1000,0.62);if(out.size>2500000)out=toJpeg(800,0.55);return {dataUrl:out.dataUrl,size:out.size,orig:orig,width:out.width,height:out.height,saved:orig>0?Math.max(0,Math.round((1-out.size/orig)*100)):0}}
var _opa7_orig_rcAfPick=rcAfPick;

<script>

function opa8CopyText(txt,msg){try{if(!txt) {toast('Tidak ada teks untuk disalin.');return;} if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(msg||'Disalin.')).catch(()=>opa8CopyFallback(txt));} else {opa8CopyFallback(txt);}}catch(e){opa8CopyFallback(txt);}}
function opa8CopyFallback(txt){const a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;left:-999px';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();toast(ok?'Disalin.':'Gagal menyalin. Blokir teks lalu Ctrl+C.');}
function opa8CopyField(id,label){const el=document.getElementById(id);if(!el){toast('Field tidak ditemukan.');return;}const v=(el.value||el.textContent||'').trim();if(!v){toast((label||'Field')+' masih kosong.');return;}opa8CopyText(v,(label||'Field')+' disalin.');}
function opa8CopySummaryWA(id){const c=rcFind(id);if(!c){toast('Kandidat tidak ditemukan.');return;}const lines=['Nama: '+(c.name||''),'HP: '+(c.hp||''),'Email: '+(c.em||''),'Domisili: '+(c.dom||c.ad||''),'Posisi: '+(c.pos||''),'Pendidikan: '+(c.edu||''),'Pengalaman: '+(c.exp||'')];opa8CopyText(lines.join('\n'),'Ringkasan WA disalin.');}

function opa8ZoomPreview(delta){const box=document.querySelector('#rc_pv .opa8-preview-box img, #opa8-cv-box img');if(!box){toast('Preview gambar tidak ditemukan. Untuk PDF, pakai zoom bawaan viewer.');return;}let s=parseFloat(box.dataset.zoom||'1');s=Math.max(0.5,Math.min(3,s+delta));box.dataset.zoom=s;box.style.transform='scale('+s+')';box.style.transformOrigin='top center';const lab=document.getElementById('opa8-zoom-lab');if(lab)lab.textContent=Math.round(s*100)+'%';}
function opa8RotatePreview(){const box=document.querySelector('#rc_pv .opa8-preview-box img, #opa8-cv-box img');if(!box){toast('Rotate hanya untuk preview gambar.');return;}let r=parseInt(box.dataset.rot||'0',10);r=(r+90)%360;box.dataset.rot=r;let s=parseFloat(box.dataset.zoom||'1');box.style.transform='rotate('+r+'deg) scale('+s+')';}
async function opa8FillFromOcr(fieldId,txt){const el=document.getElementById(fieldId);if(!el){toast('Field tidak ditemukan.');return;}const old=(el.value||'').trim();if(old&&old!==txt){if(!await opaConfirm('Field sudah terisi: '+old+'. Timpa dengan: '+txt+'?')){return;}}el.value=txt;el.classList.add('chk');toast('Diisi dari hasil baca. Periksa lalu simpan.');}
function opa8ShowOcrPanel(text,parsed){let panel=document.getElementById('opa8-ocr-panel');if(!panel){const pv=document.getElementById('rc_pv');if(!pv){return;}panel=document.createElement('div');panel.id='opa8-ocr-panel';panel.className='card';panel.style.marginTop='12px';pv.parentNode.insertBefore(panel,pv.nextSibling);}const conf=parsed&&parsed._conf?parsed._conf:{};function badge(k){if(!parsed||!parsed[k]){return '<span class="opa8-badge miss">Tidak ketemu</span>';}if(conf[k]==='yakin'){return '<span class="opa8-badge ok">Yakin</span>';}return '<span class="opa8-badge warn">Ragu, cek</span>';}const fields=[['nm','Nama','rc_nm'],['hp','HP','rc_hp'],['em','Email','rc_em'],['nik','NIK',''],['ttl','TTL',''],['dom','Domisili','rc_dom'],['ad','Alamat','rc_ad'],['edu','Pendidikan','rc_edu'],['pos','Posisi','rc_pos'],['src','Sumber','rc_src'],['exp','Pengalaman','rc_exp'],['skl','Keahlian','rc_skl']];let rows='';fields.forEach(f=>{const key=f[0];const label=f[1];const fid=f[2];const val=parsed?parsed[key]||'':'';if(val){rows+='<div class="opa8-field"><b>'+label+' '+badge(key)+'</b><span class="v">'+val.replace(/</g,'&lt;')+'</span>'+(fid?'<button class="btn s" onclick="opa8FillFromOcr(\''+fid+'\',\''+val.replace(/'/g,"\\'").replace(/\n/g,' ')+'\')">Pakai</button><button class="btn s" onclick="opa8CopyText(\''+val.replace(/'/g,"\\'").replace(/\n/g,' ')+'\',\''+label+' disalin.\')">Salin</button>':'<button class="btn s" onclick="opa8CopyText(\''+val.replace(/'/g,"\\'").replace(/\n/g,' ')+'\',\''+label+' disalin.\')">Salin</button>')+'</div>';}});panel.innerHTML='<h3>Hasil Baca Otomatis v2</h3><div style="font-size:12.5px;color:var(--mut)">Klik <b>Pakai</b> untuk isi form, <b>Salin</b> untuk copy. Field yang sudah terisi tidak ditimpa diam-diam.</div><div style="margin-top:10px">'+(rows||'<div class="hint">Tidak ada field yang terbaca. Cek Teks Mentah di bawah, lalu isi manual atau klik kata di teks untuk isi form.</div>')+'</div><div class="opa8-copyrow"><button class="btn s p" onclick="opa8CopyText(document.getElementById(\'opa8-ocr-text\').value,\'Teks OCR disalin.\')">Salin Semua Teks OCR</button><button class="btn s" onclick="opa8CopyText(document.getElementById(\'opa8-ocr-text\').value.slice(0,2000),\'2000 karakter pertama disalin.\')">Salin 2000 Karakter Pertama</button></div><label style="font-size:13px;font-weight:700">Teks Mentah OCR, bisa dipilih dan dicopy</label><textarea id="opa8-ocr-text" class="opa8-ocr" readonly>'+(text||'').replace(/</g,'&lt;')+'</textarea><div class="hint" style="margin-top:8px">Tips: Blokir teks di atas, Ctrl+C untuk copy. Atau klik kata di teks, lalu pilih field tujuan di bawah.<br><button class="btn s" onclick="opa8FillFromOcr(\'rc_nm\', (function(){const t=document.getElementById(\'opa8-ocr-text\');return t.value.substring(t.selectionStart,t.selectionEnd)||t.value;})())">Isi Nama dari Teks yang Dipilih</button> <button class="btn s" onclick="opa8FillFromOcr(\'rc_hp\', (function(){const t=document.getElementById(\'opa8-ocr-text\');return t.value.substring(t.selectionStart,t.selectionEnd)||t.value;})())">Isi HP dari Teks yang Dipilih</button> <button class="btn s" onclick="opa8FillFromOcr(\'rc_ad\', (function(){const t=document.getElementById(\'opa8-ocr-text\');return t.value.substring(t.selectionStart,t.selectionEnd)||t.value;})())">Isi Alamat dari Teks yang Dipilih</button></div>';}
function opa8Parse2(t){const raw=String(t||'');const L=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const o={};const conf={};function set(k,v,c){if(v&&!o[k]){o[k]=String(v).trim();conf[k]=c||'ragu';}}const ems=[...raw.matchAll(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g)].map(m=>m[0]);if(ems.length){set('em',ems[0],'yakin');}const nikM=raw.match(/(?:NIK|KTP|No\.?\s*KTP)[^\d]{0,20}(\d{16})/i)||raw.match(/\b(\d{16})\b/);if(nikM){set('nik',nikM[1],'yakin');}const ttlM=raw.match(/(?:TTL|Tempat\s*\/\s*Tanggal\s*Lahir|Lahir|Born)[^\n]{0,40}([A-Za-z ]+),\s*(\d{1,2}\s+(?:Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember)\s+\d{4})/i);if(ttlM){set('ttl',(ttlM[1].trim()+', '+ttlM[2]).trim(),'yakin');}const labelVal=(labels)=>{for(const lb of labels){const idx=L.findIndex(x=>new RegExp('^'+lb+'\\s*[:\\-]', 'i').test(x));if(idx>=0){const v=L[idx].replace(new RegExp('^'+lb+'\\s*[:\\-]?\\s*','i'),'').trim();if(v){return v;}if(L[idx+1]){return L[idx+1];}}}return '';};const nmLabel=labelVal(['Nama Lengkap','Nama']);if(nmLabel){set('nm',nmLabel,'yakin');}if(!o.nm){const nm=L.slice(0,15).find(x=>/^[A-Za-z.'\- ]{4,60}$/.test(x)&&x.split(/\s+/).length>=2&&x.split(/\s+/).length<=6&&!/curriculum|vitae|resume|riwayat|daftar|profile|profil|biodata|alamat|email|telepon|hp|kontak|^cv$/i.test(x)&&!/^\d/.test(x));if(nm){set('nm',nm,'ragu');}}const hpAll=[...raw.matchAll(/(?:\+?62|0)8[\d\s().\-]{7,14}\d/g)].map(m=>m[0].replace(/[\s().\-]/g,''));const hpClean=[...new Set(hpAll)].filter(h=>/^(\+?62|0)8\d{8,11}$/.test(h));if(hpClean.length){set('hp',hpClean[0],'yakin');if(hpClean.length>1){o.hpAll=hpClean.join(', ');}}const domLabel=labelVal(['Domisili','Kota Tinggal','Tinggal di','Kota']);if(domLabel){set('dom',domLabel,'yakin');}const adLabel=labelVal(['Alamat Lengkap','Alamat','Address']);if(adLabel){let ad=adLabel;const ai=L.findIndex(x=>/^alamat/i.test(x));if(ai>=0&&L[ai+1]&&L[ai+1].length>5&&!/email|telepon|hp/i.test(L[ai+1])){ad=ad+' '+L[ai+1];}set('ad',ad,'yakin');}if(!o.ad){const jl=L.find(x=>/^(Jl\.?|Jalan|Gg\.?|Perum|Kp\.?|Desa|Kelurahan)/i.test(x));if(jl){set('ad',jl,'ragu');}}const eduLabel=labelVal(['Pendidikan Terakhir','Pendidikan','Education']);if(eduLabel){set('edu',eduLabel,'yakin');}if(!o.edu){const ed=L.find(x=>/\b(S[123]|D[34]|SMA|SMK|SMP|Diploma|Sarjana|Magister)\b/i.test(x)&&x.length<140);if(ed){set('edu',ed,'ragu');}}const posLabel=labelVal(['Melamar Sebagai','Posisi yang Dilamar','Posisi Dilamar','Jabatan yang Dilamar','Lamaran','Apply','Posisi']);if(posLabel){set('pos',posLabel,'yakin');}const srcM=raw.match(/(Jobstreet|Indeed|Instagram|LinkedIn|Referensi|Walk\s*in|Facebook|Kalibrr|Glints)/i);if(srcM){set('src',srcM[1],'yakin');}function section(keys,nextKeys,maxLines){for(const k of keys){const i=L.findIndex(x=>new RegExp('^'+k+'\\b','i').test(x)&&x.length<50);if(i>=0){let out=[];for(let j=i+1;j<L.length&&out.length<maxLines;j++){const line=L[j];if(nextKeys.some(nk=>new RegExp('^'+nk+'\\b','i').test(line)&&line.length<50)){break;}out.push(line);}return out.join('\n');}}return '';}const exp=section(['Pengalaman Kerja','Pengalaman','Experience','Riwayat Pekerjaan','Riwayat Kerja'],['Pendidikan','Keahlian','Skills','Kemampuan','Bahasa','Pendidikan Terakhir'],12);if(exp){set('exp',exp,'yakin');}const skl=section(['Keahlian','Skills','Kemampuan','Skill'],['Pengalaman','Pendidikan','Bahasa','Pengalaman Kerja'],6);if(skl){set('skl',skl.replace(/\n/g,', '),'yakin');}const langM=raw.match(/Bahasa\s*:\s*([^\n]+)/i);if(langM){set('lang',langM[1],'yakin');}const salM=raw.match(/(?:Gaji|Salary|Ekspektasi)[^\d]{0,20}([\d.,]{4,})/i);if(salM){set('sal',salM[1],'ragu');}o._conf=conf;return o;}
