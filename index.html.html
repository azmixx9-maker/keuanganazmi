function streak(){const B=budget(),f=S.tx.length?S.tx.map(x=>x.d).sort()[0]:today();let s=0,d=today();if(spent(d)>B)return 0;s=1;d=addD(d,-1);while(d>=f&&spent(d)<=B){s++;d=addD(d,-1)}return s}
function ctx(){const B=budget(),l=B-spent(today()),a=[];a.push(l>=0?`Sisa jatah hari ini ${Rp(l)}. Jaga terus ya, ${NM}.`:`Jatah hari ini lewat ${Rp(-l)}. Tahan dulu jajannya.`);a.push(`Tinggal ${dl()} hari lagi menuju gajian tanggal ${S.set.pd}.`);a.push(cicPaid(today().slice(0,7))?'Cicilan BRI bulan ini sudah beres. Satu beban lepas!':`Cicilan BRI bulan ini (${Rp(CIC)}) belum dibayar. Jangan sampai telat!`);a.push(`Tabungan Laptop baru ${Math.round(bal('blu')/S.set.lt*100)}% dari target. Setiap setoran mendekatkanmu.`);return a}
function donut(cx){const m={};cx.filter(x=>x.t=='out').forEach(x=>m[x.cat]=(m[x.cat]||0)+x.amt);const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),T=e.reduce((s,x)=>s+x[1],0);if(!T)return'<p class="mu">Belum ada pengeluaran di siklus ini.</p>';let o=0;const C=2*Math.PI*40;
return`<div class="fl"><svg viewBox="0 0 100 100" width="125" height="125" style="transform:rotate(-90deg)">${e.map(([k,v],i)=>{const l=v/T*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${PAL[i%8]}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}"/>`;o+=l;return s}).join('')}</svg><div class="lg">${e.map(([k,v],i)=>`<div><span style="background:${PAL[i%8]}"></span>${esc(k)} ${Math.round(v/T*100)}%</div>`).join('')}</div></div>`}
function bars(){const n=new Date(),ks=[];for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);ks.push([d.getFullYear()+'-'+pad(d.getMonth()+1),MB[d.getMonth()]])}
const s2=(k,t)=>S.tx.filter(x=>x.d.startsWith(k)&&x.t==t).reduce((s,x)=>s+x.amt,0),v=ks.map(([k])=>[s2(k,'in'),s2(k,'out')]),mx=Math.max(1,...v.flat());
return`<svg viewBox="0 0 300 125" width="100%">${ks.map((k,i)=>{const x=i*50+8,h1=v[i][0]/mx*90,h2=v[i][1]/mx*90;return`<rect x="${x}" y="${100-h1}" width="15" height="${h1}" rx="3" fill="#10B981"/><rect x="${x+17}" y="${100-h2}" width="15" height="${h2}" rx="3" fill="#EF4444"/><text x="${x+16}" y="116" font-size="10" text-anchor="middle" fill="currentColor">${k[1]}</text>`}).join('')}</svg><div class="lg"><span style="background:#10B981"></span>Masuk &nbsp; <span style="background:#EF4444"></span>Keluar</div>`}
function home(){const b={};POS.forEach(p=>b[p]=bal(p));const rd=b.bca+b.cash,pr=b.bri+b.blu,lo=loanTot(),h=new Date().getHours(),g=h<11?'Pagi':h<15?'Siang':h<18?'Sore':'Malam';
const B=budget(),sp=spent(today()),pc=B?sp/B:sp?2:0,k=pc>1?'r':pc>=.8?'y':'g',left=B-sp,c0=cyc(today()),cx=S.tx.filter(x=>cyc(x.d)==c0),pool=ctx().concat(S.quotes),qt=pool[(seed+qi)%pool.length];
const msg=k=='r'?`OVER BUDGET! Pengeluaran hari ini melewati batas sebesar ${R(-left)}. Stop jajan dulu hari ini!`:k=='y'?`Hati-hati ${NM}, jatah jajan hari ini tinggal ${R(left)} lagi!`:`Mantap, ${NM}! Pengeluaran hari ini masih aman di bawah batas (sisa ${R(left)} lagi). Pertahankan sampai gajian tanggal ${S.set.pd}!`;
const qa=[['Scan Nota','scan','#0EA5A4','scan()'],['Catat Keluar','arrowup','#EF4444',"openAdd('out')"],['Catat Masuk','arrowdown','#10B981',"openAdd('in')"],['Transfer Pos','swap','#005BAA',"openAdd('tf')"],['Bagi Gaji','wallet','#F59E0B','bagiGaji()'],['Catat Piutang','users','#6366F1',"openAdd('loan')"],['Bayar BRI','bank','#F37021','payCicil()'],['Cek Beli','cart','#00B4D8','cekBeli()'],['Laporan','chart','#6366F1','lap()'],['Tarik Tunai','cash','#0F766E',"openAdd('tf',null,{p:'bca',to:'cash',note:'Tarik tunai'})"]];
let cal='';for(let i=13;i>=0;i--){const d=addD(today(),-i),o=spent(d)>B;cal+=`<i class="${o?'o':S.tx.some(x=>x.d<=d)?'a':''}">${pdt(d).getDate()}</i>`}
return`<div class="hd"><div class="row"><div><small>Selamat ${g},</small><h1>${NM}</h1></div><div style="text-align:right"><small>${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</small><br><b>${ic('clock',15)} ${dl()} hari lagi gajian tgl ${S.set.pd}</b></div></div>
<div class="bal"><div class="row"><small>Total Seluruh Aset</small><button class="eye" aria-label="Sembunyikan saldo" onclick="eye()">${ic(S.hide?'eyeoff':'eye',22)}</button></div><h2>${M(rd+pr+lo)}</h2><div class="g3"><div><small>Siap Pakai</small><b>${M(rd)}</b></div><div><small>Terproteksi</small><b>${M(pr)}</b></div><div><small>Piutang</small><b>${M(lo)}</b></div></div></div></div>
<div class="card"><div class="qa">${qa.map(a=>`<button onclick="${a[3]}"><span class="ci" style="background:${a[2]}1A;color:${a[2]}">${ic(a[1],22)}</span>${a[0]}</button>`).join('')}</div></div>
${jatah(B,sp,pc,k,left,msg)}
${dueCard()}${favCard()}<div class="card"><div class="row"><h3>${ic('msg',18)}Pengingat Hemat</h3><button class="sm ghost" onclick="qi++;render()">${ic('refresh',16)} Ganti</button></div><p style="margin:0">${esc(qt)}</p></div>
<div class="pos">${POS.map(p=>`<div class="card" style="border-top:4px solid ${PC[p]}" onclick="F={c:'cur',t:'all',p:'${p}',q:''};go('mut')"><small>${PN[p]}</small><b>${M(b[p])}</b></div>`).join('')}</div>
<div class="card"><h3>Arus Kas Siklus Ini <small>(${fd(c0)} – ${fd(cycEnd(c0))})</small></h3><div class="g3"><div><small>Masuk</small><b class="g">${M(sum(cx,'in'))}</b></div><div><small>Keluar</small><b class="r">${M(sum(cx,'out'))}</b></div><div><small>Net</small><b>${M(sum(cx,'in')-sum(cx,'out'))}</b></div></div></div>
<div class="card"><h3>${ic('flame',18)}${streak()} Hari Disiplin Berturut-turut</h3><div class="cal">${cal}</div><small>Hijau = aman, merah = over budget (14 hari terakhir)</small></div>
<div class="card"><h3>Pengeluaran per Kategori</h3>${donut(cx)}</div><div class="card"><h3>Masuk vs Keluar (6 bulan)</h3>${bars()}</div>`}
/* ---------- MUTASI ---------- */
const IC={in:['arrowdown','g','+'],out:['arrowup','r','-'],tf:['swap','',''],loan:['users','pu','-'],repay:['undo','pu','+']};
function row(x){const i=IC[x.t];return`<div class="it" onclick="txd('${x.id}')"><i style="background:${PC[x.p]}1F;color:${PC[x.p]}">${ic(i[0],18)}</i><div><b>${esc(x.t=='tf'?PN[x.p]+' → '+PN[x.to]:x.cat)}</b><small>${PN[x.p]}${x.note?' · '+esc(x.note):''}</small></div><em class="${i[1]}">${i[2]}${M(x.amt).replace('-','')}</em></div>`}
function mut(){const cs=[...new Set(S.tx.map(x=>cyc(x.d)).concat(cyc(today())))].sort().reverse();
return`<div class="top"><h1>Mutasi</h1></div><div class="card"><select id="f1" onchange="F.c=this.value;lst()"><option value="all">Semua siklus</option>${cs.map((c,i)=>`<option value="${i?c:'cur'}" ${(F.c==c||(F.c=='cur'&&!i))?'selected':''}>${fd(c)} – ${fd(cycEnd(c))}</option>`).join('')}</select>
<div style="display:flex;gap:8px"><select onchange="F.t=this.value;lst()">${[['all','Semua jenis'],['in','Masuk'],['out','Keluar'],['tf','Transfer'],['loan','Piutang']].map(([k,l])=>`<option value="${k}" ${F.t==k?'selected':''}>${l}</option>`).join('')}</select><select onchange="F.p=this.value;lst()"><option value="all">Semua pos</option>${POS.map(p=>`<option value="${p}" ${F.p==p?'selected':''}>${PN[p]}</option>`).join('')}</select></div><input type="search" placeholder="Cari catatan…" value="${esc(F.q)}" oninput="F.q=this.value;lst()" style="margin-bottom:0"></div><div id="ml"></div>`}
function lst(){let a=S.tx.slice();const cur=cyc(today());if(F.c!='all')a=a.filter(x=>cyc(x.d)==(F.c=='cur'?cur:F.c));if(F.t!='all')a=a.filter(x=>F.t=='loan'?x.t=='loan'||x.t=='repay':x.t==F.t);if(F.p!='all')a=a.filter(x=>x.p==F.p||x.to==F.p);if(F.q)a=a.filter(x=>((x.note||'')+x.cat).toLowerCase().includes(F.q.toLowerCase()));
a.sort((x,y)=>y.d.localeCompare(x.d)||y.id.localeCompare(x.id));let h='',l='';a.forEach(x=>{if(x.d!=l){l=x.d;h+=(h?'</div>':'')+`<div class="dh">${x.d==today()?'Hari Ini':x.d==addD(today(),-1)?'Kemarin':fd(x.d)}</div><div class="card" style="margin-top:6px">`}h+=row(x)});$('#ml').innerHTML=h?h+'</div>':'<div class="card mu">Belum ada transaksi. Tekan + untuk mencatat.</div>'}
function txd(id){const x=S.tx.find(y=>y.id==id);if(!x)return;sh(`<h3>${esc(x.cat)}</h3><p>${fd(x.d)} · ${PN[x.p]}${x.to?' → '+PN[x.to]:''}<br><b class="big">${R(x.amt)}</b><br>${esc(x.note||'')}</p>${['in','out','tf'].includes(x.t)?`<button class="pri" onclick="openAdd('${x.t}','${id}')">Edit</button>`:''}<button class="pri dng" onclick="del('${id}')">Hapus</button><div id="ti"></div>`);if(x.img)idbGet(id).then(u=>u&&($('#ti').innerHTML=`<img src="${u}" style="width:100%;border-radius:12px;margin-top:8px">`))}
function del(id){if(!confirm('Hapus transaksi ini? Saldo akan dikoreksi otomatis.'))return;const x=S.tx.find(y=>y.id==id);idbDel(id);S.tx=S.tx.filter(y=>y.id!=id&&!(x.t=='loan'&&y.loan==id));if(x.t=='loan')S.loans=S.loans.filter(l=>l.id!=id);save();closeSh();render()}

function fAdd(){const{t,e}=A,v=e||{},o=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join(''),po=s=>POS.map(p=>`<option value="${p}" ${p==s?'selected':''}>${PN[p]}</option>`).join('');
sh(`<div class="row"><h3>${A.id?'Edit':'Catat'} Transaksi</h3>${A.id?'':`<button class="sm ghost" onclick="scan()">${ic('scan',16)} Scan Nota</button>`}</div><div class="tabs">${[['out','Keluar'],['in','Masuk'],['tf','Transfer'],['loan','Piutang']].map(([k,l])=>`<button class="${t==k?'on':''}" ${A.id?'disabled':''} onclick="A.amt=$('#fa').value;A.t='${k}';fAdd()">${l}</button>`).join('')}</div>
<label>Nominal</label><input id="fa" inputmode="numeric" placeholder="Rp 0" oninput="fm(this)" value="${A.amt!=null?A.amt:v.amt?fmt(v.amt):''}">
${t=='loan'?'<label>Nama peminjam</label><input id="fl" placeholder="Nama">':t=='tf'?'':`<label>Kategori</label><select id="fc">${o(t=='in'?CI:CO,v.cat)}</select>`}
<label>${t=='in'?'Masuk ke pos':'Dari pos'}</label><select id="fp">${po(v.p||'bca')}</select>${t=='tf'?`<label>Ke pos</label><select id="ft">${po(v.to||'cash')}</select>`:''}
${t=='loan'?'<label>Rencana tanggal kembali (opsional)</label><input id="fdue" type="date">':''}<label>Tanggal</label><input id="fd" type="date" value="${v.d||today()}"><label>Catatan</label><input id="fn" value="${esc(v.note||'')}" placeholder="Opsional">${(t=='in'||t=='out')&&!A.id?'<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" id="ffv" style="width:auto;min-height:0;margin:0"> Simpan sebagai favorit</label>':''}<button class="pri" onclick="saveTx()">Simpan</button>`)}
function guard(t,p,cat){if(t=='in')return 1;if(p=='bri'&&cat!='Cicilan BRI')return confirm('BRI adalah rekening cadangan, Azmi. Yakin ingin pakai saldo ini?');if(p=='blu'&&bal('blu')<S.set.lt)return confirm('Blu adalah tabungan terkunci untuk Laptop dan targetnya belum tercapai, Azmi. Yakin ingin memakai saldo ini?');return 1}
function saveTx(){const t=A.t,a=amt('#fa');if(!a)return toast('Isi nominal dulu');const p=$('#fp').value,cat=t=='in'||t=='out'?$('#fc').value:t=='tf'?'Transfer':'Piutang';
if(t=='tf'&&$('#ft').value==p)return toast('Pos asal dan tujuan sama');if(t=='loan'&&!$('#fl').value.trim())return toast('Isi nama peminjam');if(!guard(t,p,cat))return;
const x={id:A.id||uid(),d:$('#fd').value||today(),t,p,amt:a,cat,note:$('#fn').value.trim()};if(t=='tf')x.to=$('#ft').value;x.cic=cat=='Cicilan BRI'&&t=='out'?x.d.slice(0,7):undefined;
if(A.id){const o=S.tx.find(y=>y.id==A.id);Object.assign(o,x)}else{S.tx.push(x);if(t=='loan')S.loans.push({id:x.id,name:$('#fl').value.trim(),amt:a,from:p,d:x.d,due:$('#fdue').value,note:x.note})}
if(A.img&&!A.id){x.img=1;idbPut(x.id,A.img)}if($('#ffv')&&$('#ffv').checked)S.fav.push({id:uid(),name:x.note||cat,amt:a,cat,p,t});save();closeSh();render();if(t=='out')alertDaily(x)}
function alertDaily(x){if(!['bca','cash'].includes(x.p)||['Tagihan/Kuota','Cicilan BRI'].includes(x.cat)||x.d!=today())return;const B=budget(),s=spent(today());
if(s>B)pop(`OVER BUDGET HARI INI! Pengeluaranmu melewati batas sebesar ${R(s-B)}. Stop jajan dulu hari ini biar jatah harian sampai tanggal ${S.set.pd} tetap aman!<br><small>Jatah harian besok disesuaikan menjadi sekitar ${R(S.set.mode=='fixed'?S.set.daily:bal('bca')/Math.max(1,dl()-1))}/hari.</small>`);

function payCicil(){const k=today().slice(0,7);if(cicPaid(k))return toast('Cicilan bulan ini sudah dibayar ');if(!confirm('Bayar cicilan BRI '+Rp(CIC)+' dari saldo BRI?'))return;S.tx.push({id:uid(),d:today(),t:'out',p:'bri',amt:CIC,cat:'Cicilan BRI',note:'Cicilan kredit BRI',cic:k});save();render();toast('Cicilan BRI bulan ini lunas ')}

tf('bri',CIC,'Bagi Gaji: dana cicilan BRI');tf('bri',c,'Bagi Gaji: cadangan');tf('blu',b,'Bagi Gaji: tabungan Laptop');tf('cash',k,'Bagi Gaji: tarik tunai');S.set.pre={bri:c,blu:b,cash:k};save();closeSh();render();toast('Gaji berhasil dibagi ')}

return`<div class="top"><h1>Target & Piutang</h1></div>

<div style="display:flex;gap:8px"><label class="sm" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px">${ic('camera',16)} Ambil Foto<input class="hf" type="file" accept="image/*" capture="environment" onchange="scanFile(this.files[0])"></label><label class="sm ghost" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px">${ic('image',16)} Pilih File<input class="hf" type="file" accept="image/*,.txt,.csv,text/plain" onchange="scanFile(this.files[0])"></label></div>

function prep(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.9))};i.onerror=()=>no('img');i.src=u})}
function loadT(){return new Promise((ok,no)=>{if(window.Tesseract)return ok(window.Tesseract);const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';e.onload=()=>ok(window.Tesseract);e.onerror=()=>no('net');document.head.appendChild(e)})}
async function scanFile(f){if(!f)return;const o=$('#sc');try{if(/text|csv/.test(f.type)||/\.(txt|csv)$/i.test(f.name))return scRes(await f.text());
const u=await prep(f);o.innerHTML=`<img src="${u}" style="width:100%;max-height:180px;object-fit:contain;border-radius:12px;background:var(--bg)"><p class="mu" id="sp">Menyiapkan mesin baca…</p>`;let w;

const r=await w.recognize(u);await w.terminate();$('#st').value=r.data.text;scRes(r.data.text,u)}catch(e){o.innerHTML='<p class="r">Gagal membaca file. Coba foto yang lebih jelas atau tempel teksnya.</p>'}}
function parseTx(t){const L=t.split(/\n/).map(x=>x.trim()).filter(Boolean),T=t.toLowerCase(),MN=['jan','feb','mar','apr','mei','jun','jul','agu','sep','okt','nov','des'];
const cl=x=>x.replace(/\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/g,' ').replace(/\d{1,2}\s*(jan|feb|mar|apr|mei|may|jun|jul|agu|aug|sep|okt|oct|nov|des|dec)[a-z]*\.?,?\s*\d{2,4}/gi,' ').replace(/\d{1,2}:\d{2}(:\d{2})?/g,' ');
const tok=x=>cl(x).split(/\s+/).map(w=>w.replace(/^(rp\.?|idr)/i,'').replace(/[^\d.,]/g,'')).filter(w=>/^(\d{1,3}([.,]\d{3})+|\d{4,9})([.,]\d{1,2})?$/.test(w)).map(w=>+w.replace(/[.,]\d{1,2}$/,'').replace(/[.,]/g,'')).filter(n=>n>=500&&n<1e9);
const pri=[],sec=[],all=[];L.forEach((l,i)=>{const w=l.toLowerCase();let v=tok(l);if(!v.length&&/total|jumlah|nominal|amount|tagihan|bayar/.test(w)&&L[i+1])v=tok(L[i+1]);all.push(...v);
if(/sub\s*total|diskon|discount|ppn|pajak|tax|kembali|change|tunai|cash|admin|biaya/.test(w))return;if(/total|jumlah|nominal|amount|tagihan/.test(w))pri.push(...v);else if(/bayar|harga/.test(w))sec.push(...v)});
const mx=a=>Math.max(...a),amt=pri.length?mx(pri):sec.length?mx(sec):all.length?mx(all):0,nums=[...new Set([amt,...all.sort((a,b)=>b-a)])].filter(Boolean).slice(0,5);
let d=today(),y,mo,da;const m1=T.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/),m2=T.match(/(\d{1,2})\s*(jan|feb|mar|apr|mei|may|jun|jul|agu|aug|sep|okt|oct|nov|des|dec)[a-z]*\.?,?\s*(\d{2,4})/);
if(m1){da=+m1[1];mo=+m1[2];y=+m1[3]}else if(m2){const q={may:'mei',aug:'agu',oct:'okt',dec:'des'}[m2[2]]||m2[2];da=+m2[1];mo=MN.indexOf(q)+1;y=+m2[3]}
if(y){if(y<100)y+=2000;const c=y+'-'+pad(mo)+'-'+pad(da);if(mo>=1&&mo<=12&&da>=1&&da<=31&&c<=today()&&c>addD(today(),-400))d=c}
const note=(L.find(l=>/[a-z]{3,}/i.test(l)&&!/^(struk|nota|receipt|invoice|bukti|transaksi|berhasil)/i.test(l))||'').slice(0,40);
const f=x=>/brimo|\bbri\b/.test(x)?'bri':/\bblu\b/.test(x)?'blu':/bca/.test(x)?'bca':'';let p=f(L.slice(0,6).join(' ').toLowerCase())||f(T)||'bca';
let t2='out',cat='Lainnya';if(/gaji|salary|payroll|dana masuk|transfer masuk|diterima/.test(T)){t2='in';cat=/gaji|salary|payroll/.test(T)?'Gaji Bulanan':'Lainnya'}else{
const K=[['Makan & Minum',/kfc|mcd|burger|resto|warung|kopi|coffee|cafe|bakso|ayam|nasi|mie |sate|pizza|starbucks|janji jiwa|kenangan|gofood|grabfood|shopeefood|boba|bakery|roti/],['Transport/Bensin',/pertamina|shell|spbu|pertalite|pertamax|bensin|grab|gojek|gocar|goride|maxim|indrive|parkir|tol |krl|transjakarta|mrt/],['Gym & Nutrisi',/gym|fitness|whey|protein|suplemen|vitamin|nutrition/],['Tagihan/Kuota',/telkomsel|indosat|smartfren|axis|pln|listrik|token|pulsa|kuota|indihome|internet|bpjs|pdam|netflix|spotify|youtube/],['Hiburan/Jajan',/bioskop|cinema|xxi|cgv|steam|playstation|konser|tiket|game/],['Belanja Harian',/indomaret|alfamart|alfamidi|superindo|hypermart|lotte|giant|transmart|toko|mart|supermarket|tokopedia|shopee/]];
for(const[c,re]of K)if(re.test(T)){cat=c;break}if(/angsuran|cicilan|kredit/.test(T)&&/\bbri\b/.test(T)){cat='Cicilan BRI';p='bri'}}
return{amt,nums,d,note,cat,t:t2,p}}

function jatah(B,sp,pc,k,left,msg){const C=2*Math.PI*44,col={g:'var(--g)',y:'var(--y)',r:'var(--r)'}[k],pr=Math.min(1,pc),nb=S.set.mode=='fixed'?S.set.daily:Math.max(0,bal('bca')/Math.max(1,dl()-1)),ds7=[];for(let i=6;i>=0;i--){const d=addD(today(),-i);ds7.push([d,spent(d)])}

return`<div class="card"><div class="row"><h3>${ic('wallet',18)}Jatah Jajan Hari Ini</h3><button class="sm ghost" onclick="jatahSh()">${ic('sliders',16)} Atur</button></div>

<svg viewBox="0 0 280 62" width="100%" style="margin-top:6px"><line x1="0" x2="280" y1="${by}" y2="${by}" stroke="var(--m)" stroke-width="1" stroke-dasharray="3 3"/>${ds7.map((x,i)=>{const h=Math.max(2,x[1]/mx*40),o=x[1]>B;return`<rect x="${i*40+8}" y="${46-h}" width="24" height="${h}" rx="5" fill="${o?'var(--r)':'var(--g)'}" opacity="${i==6?1:.55}"/><text x="${i*40+20}" y="59" font-size="9" text-anchor="middle" fill="currentColor">${HN[pdt(x[0]).getDay()]}</text>`}).join('')}</svg><small>7 hari terakhir · garis putus-putus = batas harian</small></div>`}
function jatahSh(){const s=S.set;sh(`<h3>Atur Jatah Harian</h3><div class="tabs"><button class="${s.mode=='auto'?'on':''}" onclick="sv('mode','auto');jatahSh()">Otomatis</button><button class="${s.mode=='fixed'?'on':''}" onclick="sv('mode','fixed');jatahSh()">Nominal Tetap</button></div>${s.mode=='fixed'?`<label>Batas harian tetap</label><input id="jd" inputmode="numeric" value="${fmt(s.daily)}" oninput="fm(this)"><button class="pri" onclick="sv('daily',amt('#jd'));closeSh()">Simpan</button>`:`<p class="mu">Otomatis = (saldo BCA + jajan hari ini) ÷ ${Math.max(1,dl())} hari menuju gajian tgl ${s.pd}. Saldo BCA saat ini ${M(bal('bca'))}.</p>`}`)}
/* ---------- UPGRADE ---------- */
const hp=p=>{let h=2166136261;for(const c of 'azmi|'+p){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'h'+(h>>>0).toString(36)};
const mTo=m=>{const[y,o]=m.split('-'),n=new Date();return Math.max(1,(y-n.getFullYear())*12+(o-1-n.getMonth()))};
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('azmi',1);q.onupgradeneeded=()=>q.result.createObjectStore('img');q.onsuccess=()=>ok(q.result);q.onerror=()=>no()});
const idbPut=(k,v)=>idb().then(d=>d.transaction('img','readwrite').objectStore('img').put(v,k)).catch(()=>toast('Foto gagal disimpan'));
const idbGet=k=>idb().then(d=>new Promise(ok=>{const q=d.transaction('img').objectStore('img').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})).catch(()=>{});
const idbDel=k=>idb().then(d=>d.transaction('img','readwrite').objectStore('img').delete(k)).catch(()=>{});
const thumb=u=>new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.6))};i.onerror=()=>ok();i.src=u});
function backup(){const t=JSON.stringify(S),ok=()=>{S.lastBackup=Date.now();save();render()},f=new File([t],'azmi-finance-backup.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Backup Azmi Finance'}).then(ok).catch(()=>{});else{dl2('azmi-finance-backup.json',t,'application/json');ok()}}
function dues(){const a=[],t=today(),dn=pdt(t).getDate(),c=cyc(t);
S.loans.forEach(l=>{if(rem(l)>0&&l.due&&l.due<=addD(t,3))a.push([l.due<t?'alert':'clock',`${esc(l.name)} perlu mengembalikan ${R(rem(l))} (${l.due<t?'lewat':'jatuh tempo'} ${fd(l.due)})`])});
S.bills.forEach(b=>{if(b.day&&!S.paid[c+'|'+b.id]){const d=b.day-dn;if(d<=3&&d>=-5)a.push([d<0?'alert':'clock',`${esc(b.name)} ${R(b.amt)} ${d<0?'lewat '+(-d)+' hari':d==0?'jatuh tempo hari ini':'jatuh tempo '+d+' hari lagi'}`])}});
if(!cicPaid(t.slice(0,7))&&dn>=25)a.push(['alert',`Cicilan BRI ${R(CIC)} belum dibayar bulan ini`]);
if(S.tx.length&&Date.now()-S.lastBackup>6048e5)a.push(['warn',`Backup ${S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5)+' hari lalu':'belum pernah dilakukan'}. <u onclick="backup()" style="color:var(--b)">Backup sekarang</u>`]);return a}
const dueCard=()=>{const d=dues();return d.length?`<div class="card"><h3>${ic('clock',18)}Pengingat</h3>${d.map(x=>`<div class="bn ${x[0]=='alert'?'r':x[0]=='warn'?'y':'g'}" style="margin:6px 0">${ic(x[0],20)}<span>${x[1]}</span></div>`).join('')}</div>`:''};
const favCard=()=>`<div class="card"><div class="row"><h3>${ic('wallet',18)}Favorit</h3><button class="sm ghost" onclick="favSh()">Kelola</button></div>${S.fav.length?`<div style="display:flex;gap:6px;flex-wrap:wrap">${S.fav.map(f=>`<button class="sm ghost" onclick="fvUse('${f.id}')">${esc(f.name)} · ${S.hide?'•••':R(f.amt)}</button>`).join('')}</div>`:'<small>Centang "Simpan sebagai favorit" saat mencatat, lalu catat ulang dengan satu tap.</small>'}</div>`;
function fvUse(id){const f=S.fav.find(z=>z.id==id);if(!f||!guard(f.t,f.p,f.cat))return;const x={id:uid(),d:today(),t:f.t,p:f.p,amt:f.amt,cat:f.cat,note:f.name};S.tx.push(x);save();render();toast('Tercatat: '+f.name);if(x.t=='out')alertDaily(x)}
function favSh(){sh(`<h3>Kelola Favorit</h3>${S.fav.map(f=>`<div class="it"><div><b>${esc(f.name)}</b><small>${R(f.amt)} · ${PN[f.p]} · ${esc(f.cat)}</small></div><button onclick="S.fav=S.fav.filter(z=>z.id!='${f.id}');save();favSh();render()">${ic('x',16)}</button></div>`).join('')||'<p class="mu">Belum ada favorit.</p>'}`)}
function tgt2(){const s=S.set,p=s.pre,bt=S.bills.reduce((a,b)=>a+b.amt,0),sk=Math.round(S.sink.reduce((a,z)=>a+z.amt/mTo(z.due),0)),c=cyc(today()),days=Math.round((pdt(cycEnd(c))-pdt(c))/864e5)+1,rows=[['Cicilan BRI',CIC],['Cadangan BRI',p.bri],['Tabungan Laptop',p.blu],['Tagihan rutin',bt],['Dana tahunan',sk],['Tarik tunai ke Cash',p.cash]],left=s.gaji-rows.reduce((a,x)=>a+x[1],0);
const rp=s.gaji?`${rows.map(x=>`<div class="row" style="padding:5px 0"><span>${x[0]}</span><b>${M(x[1])}</b></div>`).join('')}<div class="row" style="padding:8px 0;border-top:1px solid var(--bd)"><span>Sisa operasional BCA</span><b class="${left<0?'r':'g'}">${M(left)}</b></div><small>${left<0?'Alokasi melebihi gaji, kurangi preset.':'Jatah ideal sekitar '+M(left/days)+'/hari selama '+days+' hari.'}</small>`:'<small>Isi Gaji bulanan di Pengaturan untuk melihat rencana.</small>';
return`<div class="card"><h3>${ic('receipt',18)}Rencana Gajian</h3>${rp}</div>
<div class="card"><div class="row"><h3>${ic('bank',18)}Dana Tahunan</h3><button class="sm" onclick="sinkSh()">+ Tambah</button></div>${S.sink.map(z=>`<div class="it"><div><b>${esc(z.name)}</b><small>${R(z.amt)} · ${z.due} · sisihkan ${R(z.amt/mTo(z.due))}/bln</small></div><button onclick="if(confirm('Hapus?')){S.sink=S.sink.filter(q=>q.id!='${z.id}');save();render()}">${ic('x',16)}</button></div>`).join('')||'<small>Pajak kendaraan, servis, langganan tahunan.</small>'}</div>
<div class="card"><div class="row"><h3>${ic('target',18)}Target Lainnya</h3><button class="sm" onclick="goalSh()">+ Tambah</button></div>${S.goals.map(g=>{const z=Math.min(100,Math.round(g.saved/g.target*100));return`<div class="row"><b>${esc(g.name)}</b><small>${M(g.saved)} / ${M(g.target)}</small></div><div class="pb"><i class="g" style="width:${z}%"></i></div><div class="row"><small>${z}%</small><span><button class="sm ghost" onclick="gDep('${g.id}')">+ Setor</button> <button onclick="if(confirm('Hapus target?')){S.goals=S.goals.filter(q=>q.id!='${g.id}');save();render()}">${ic('x',16)}</button></span></div>`}).join('')||'<small>Dana darurat, liburan, dll. Progres dicatat manual.</small>'}</div>`}
function sinkSh(){sh(`<h3>Dana Tahunan</h3><label>Nama</label><input id="zn" placeholder="Pajak motor"><label>Nominal</label><input id="za" inputmode="numeric" oninput="fm(this)"><label>Jatuh tempo (bulan)</label><input id="zd" type="month"><button class="pri" onclick="if(!$('#zn').value||!amt('#za')||!$('#zd').value)return toast('Lengkapi data');S.sink.push({id:uid(),name:$('#zn').value,amt:amt('#za'),due:$('#zd').value});save();closeSh();render()">Simpan</button>`)}
function goalSh(){sh(`<h3>Target Baru</h3><label>Nama</label><input id="zn" placeholder="Dana darurat"><label>Target</label><input id="za" inputmode="numeric" oninput="fm(this)"><label>Sudah terkumpul</label><input id="zs" inputmode="numeric" oninput="fm(this)"><button class="pri" onclick="if(!$('#zn').value||!amt('#za'))return toast('Lengkapi data');S.goals.push({id:uid(),name:$('#zn').value,target:amt('#za'),saved:amt('#zs')});save();closeSh();render()">Simpan</button>`)}
function gDep(id){const n=+((prompt('Nominal setoran (Rp)')||'').replace(/\D/g,''));if(!n)return;S.goals.find(g=>g.id==id).saved+=n;save();render()}
function rcU(p){const v=$('#kb'+p).value,d=amt('#kb'+p)-bal(p);$('#kd'+p).innerHTML=v?(d==0?'<span class="g">Cocok</span>':`Selisih <b class="${d>0?'g':'r'}">${d>0?'+':''}${R(d)}</b>`):''}
function rcDo(){let n=0;POS.forEach(p=>{if($('#kb'+p).value){S.open[p]+=amt('#kb'+p)-bal(p);S.rec[p]=today();n++}});if(!n)return toast('Isi minimal satu saldo asli');save();render();toast('Saldo dicocokkan')}
function lap(){const c=cyc(today()),T=k=>S.tx.filter(x=>cyc(x.d)==k),a=T(c),b=T(cyc(addD(c,-1))),oa=sum(a,'out'),ob=sum(b,'out'),m={},B=budget();a.filter(x=>x.t=='out').forEach(x=>m[x.cat]=(m[x.cat]||0)+x.amt);
let mx=[0,''],tot=0,n=0,ov=0;for(let d=c;d<=today();d=addD(d,1)){const v=spent(d);tot+=v;n++;if(v>mx[0])mx=[v,d];if(v>B)ov++}
const avg=tot/n,pr=bal('bca')-avg*dl(),dv=ob?Math.round((oa-ob)/ob*100):0,tc=Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,3),w=(l,v)=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--bd)"><span>${l}</span><b>${v}</b></div>`;
sh(`<h3>${ic('chart',18)}Laporan Siklus</h3><small>${fd(c)} – ${fd(cycEnd(c))}</small>${w('Pemasukan',R(sum(a,'in')))}${w('Pengeluaran',R(oa)+(ob?` (${dv>0?'+':''}${dv}% vs siklus lalu)`:''))}${w('Net cashflow',R(sum(a,'in')-oa))}${w('Rata-rata jajan/hari',R(avg))}${w('Hari paling boros',mx[0]?fd(mx[1])+' · '+R(mx[0]):'-')}${w('Hari over budget',ov+' dari '+n+' hari')}${tc.map(x=>w(esc(x[0]),R(x[1]))).join('')}${w('Proyeksi saldo BCA tgl '+S.set.pd,`<span class="${pr<0?'r':'g'}">${R(pr)}</span>`)}${pr<0?'<div class="bn r" style="margin-top:8px">'+ic('alert',20)+'<span>Dengan pola sekarang saldo BCA habis sebelum gajian. Kurangi jajan.</span></div>':''}<button class="pri" onclick="print()">Simpan sebagai PDF / Cetak</button>`)}
/* ---------- TEMA, PIN, INIT ---------- */
function theme(){const dk=S.set.theme=='dark'||(S.set.theme=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.t=dk?'dark':'light'}
matchMedia('(prefers-color-scheme:dark)').addEventListener&&matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
function lock(){if(S.set.pin){$('#lk').classList.add('o');$('#lp').value='';setTimeout(()=>$('#lp').focus(),50)}}
function chk(){const v=$('#lp').value;if(v.length>=4&&(hp(v)==S.set.pin||v==S.set.pin))$('#lk').classList.remove('o')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(hid&&Date.now()-hid>30000)lock()});

document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i,+e.dataset.s||22));if(/^\d{4,6}$/.test(S.set.pin)){S.set.pin=hp(S.set.pin);save()}if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});theme();lock();render();
</script></body></html>
